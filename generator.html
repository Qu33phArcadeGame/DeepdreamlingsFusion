<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dreamlings · Dream Generator</title>
<style>
  :root{ --bg:#07040f; --panel:#120a22; --ink:#f1e9ff; --lav:#c9a0ff; --mint:#8affea; --pink:#ff8fbf; --dim:#8a78ad; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif;overflow:hidden;}
  body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    background:radial-gradient(ellipse at 50% 40%, #1c0f38 0%, var(--bg) 70%);}
  #app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:10px 14px 12px;gap:8px;}
  header{display:flex;align-items:center;gap:10px;}
  header h1{flex:1;margin:0;text-align:center;font-size:17px;letter-spacing:.02em;color:var(--lav);line-height:1.15;}
  header h1 small{display:block;font-size:12px;font-weight:normal;color:var(--mint);}
  button{font:inherit;color:var(--ink);background:#22143d;border:1px solid #3a2766;border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;}
  button:active{transform:translateY(1px);background:#2d1a52;}
  button:disabled{opacity:.38;cursor:default;transform:none;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px;}
  header button{font-size:13px;padding:8px 10px;white-space:nowrap;}
  main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  #card{display:block;touch-action:manipulation;}
  #statusWrap{min-height:36px;}
  #playbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--lav);}
  #playbar.hide{visibility:hidden;}
  #playbar label{display:flex;align-items:center;gap:8px;flex:1;white-space:nowrap;}
  #playbar input{flex:1;accent-color:#8affea;min-width:60px;}
  #speedVal,#speedOutVal{min-width:44px;color:var(--mint);font-variant-numeric:tabular-nums;}
  #boomBtn{font-size:13px;padding:7px 10px;border-radius:18px;white-space:nowrap;}
  #boomBtn.on{background:var(--mint);color:#08120e;border-color:var(--mint);font-weight:bold;}
  .tile .badge{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:bold;padding:3px 7px;border-radius:10px;background:rgba(8,4,18,.8);color:var(--mint);}
  #status{font-size:13px;color:var(--lav);text-align:center;line-height:1.35;min-height:18px;max-height:7.2em;overflow:auto;user-select:text;-webkit-user-select:text;word-break:break-word;}
  #status.err{color:#ffb3d1;}
  #bar{height:4px;border-radius:2px;background:#1d1233;margin-top:6px;overflow:hidden;visibility:hidden;}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lav),var(--mint));transition:width .15s;}
  #primary{width:100%;font-size:18px;font-weight:bold;padding:14px;border:none;color:#12081f;background:linear-gradient(135deg,var(--mint),var(--lav));}
  #primary.stop{background:linear-gradient(135deg,var(--pink),#ffb36b);}
  #row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  #row button{font-size:13px;padding:10px 2px;}
  footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);gap:8px;}
  footer button{background:none;border:none;color:var(--dim);padding:2px 0;font-size:12px;text-decoration:underline dotted;}
  #estimate{text-align:right;}
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(5,2,12,.95);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0)) 14px calc(12px + env(safe-area-inset-bottom,0));}
  .sheet.open{display:flex;}
  .sheet .top{display:flex;align-items:center;justify-content:space-between;max-width:560px;width:100%;margin:0 auto 10px;gap:10px;}
  .sheet h2{margin:0;font-size:17px;color:var(--lav);}
  .grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;max-width:560px;width:100%;margin:0 auto;align-content:start;}
  .grid h3{grid-column:1/-1;margin:6px 0 0;font-size:14px;color:var(--mint);font-weight:normal;}
  .tile{position:relative;background:none;border:none;padding:0;}
  .tile canvas{width:100%;height:auto;display:block;}
  .tile.sel canvas{outline:3px solid var(--mint);outline-offset:2px;border-radius:10px;}
  .tile .del{position:absolute;top:4px;right:4px;width:26px;height:26px;padding:0;border-radius:50%;font-size:13px;line-height:24px;background:rgba(10,5,20,.8);}
  .empty{grid-column:1/-1;color:var(--dim);text-align:center;margin-top:30px;font-size:14px;line-height:1.5;}
  #settingsBody{flex:1;overflow:auto;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:10px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;font-size:14px;padding:9px 4px;}
  .seg button.on{background:var(--lav);color:#12081f;border-color:var(--lav);font-weight:bold;}
  .field label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:4px;}
  .field label span{color:var(--dim);font-size:12px;}
  .field .ctl{display:flex;gap:10px;align-items:center;}
  .field input[type=range]{flex:1;accent-color:#c9a0ff;}
  .field input[type=number]{width:92px;font:inherit;font-size:14px;color:var(--ink);background:#1a1030;border:1px solid #3a2766;border-radius:8px;padding:6px;}
  .field.hide{display:none;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chips button{font-size:13px;padding:7px 10px;border-radius:18px;}
  .chips button.on{background:var(--mint);color:#08120e;border-color:var(--mint);font-weight:bold;}
  .note{font-size:12px;color:var(--dim);line-height:1.45;}
  select{font:inherit;font-size:14px;color:var(--ink);background:#1a1030;border:1px solid #3a2766;border-radius:8px;padding:7px;width:100%;}
  #result{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  #result img,#result video{max-width:100%;max-height:100%;border-radius:12px;}
  #resultBtns{display:flex;gap:10px;max-width:560px;width:100%;margin:12px auto 0;}
  #resultBtns button{flex:1;font-size:15px;}
  #resultHint{text-align:center;font-size:12px;color:var(--dim);margin-top:8px;}
  #exportCv{position:fixed;left:-10000px;top:0;pointer-events:none;}
  @media (prefers-reduced-motion: reduce){ #bar i{transition:none;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="backBtn" aria-label="Back to town">◀ Town</button>
    <h1>Dream Generator<small id="townName">&nbsp;</small></h1>
    <button id="galBtn">Gallery</button>
  </header>
  <main id="main"><canvas id="card" aria-label="Dream trading card"></canvas></main>
  <div id="playbar" class="hide">
    <label>Zoom in <input type="range" id="speed" min="2" max="60" step="1" value="12" aria-label="Zoom in speed, frames per second"></label>
    <span id="speedVal">12 fps</span>
    <label>Zoom out <input type="range" id="speedOut" min="2" max="60" step="1" value="12" aria-label="Zoom out speed, frames per second"></label>
    <span id="speedOutVal">12 fps</span>
    <button id="boomBtn" class="on" aria-pressed="true">⇆ Zoomerang</button>
  </div>
  <div id="statusWrap"><div id="status" role="status">Starting up…</div><div id="bar"><i></i></div></div>
  <button id="primary" disabled>Dream this card</button>
  <div id="row">
    <button id="pickBtn">Card</button>
    <button id="setBtn">Settings</button>
    <button id="keepBtn" disabled>Keep</button>
    <button id="gifBtn" disabled>GIF</button>
    <button id="vidBtn" disabled>Video</button>
  </div>
  <footer>
    <button id="engineBtn" title="Re-test which engine is fastest on this device">Engine: detecting…</button>
    <span id="estimate"></span>
  </footer>
</div>

<div class="sheet" id="picker">
  <div class="top"><h2>Pick a card to dream</h2><button id="pickClose">Close</button></div>
  <div class="grid" id="pickGrid"></div>
</div>

<div class="sheet" id="settings">
  <div class="top"><h2>Dream settings</h2><button id="setClose">Done</button></div>
  <div id="settingsBody"></div>
</div>

<div class="sheet" id="gallery">
  <div class="top"><h2>Gallery</h2><button id="galClose">Close</button></div>
  <div class="grid" id="grid"></div>
</div>

<div class="sheet" id="resultSheet">
  <div class="top"><h2 id="resultTitle">Export</h2><button id="resultClose">Close</button></div>
  <div id="result"></div>
  <div id="resultBtns"><button id="dlBtn">Download</button><button id="shareBtn">Share</button><button id="delExportBtn">Delete</button></div>
  <div id="resultHint">On a phone you can also long-press the GIF to save it to your photos.</div>
</div>
<canvas id="exportCv"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.22.0/dist/tf-backend-webgpu.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.min.js"></script>
<script>
// ===== GIF ENCODER (median-cut palette per frame + LZW) =====
function ByteOut(){ this.buf=new Uint8Array(1<<16); this.n=0; }
ByteOut.prototype.grow=function(k){ if(this.n+k<=this.buf.length) return; var nb=new Uint8Array(Math.max(this.buf.length*2,this.n+k)); nb.set(this.buf.subarray(0,this.n)); this.buf=nb; };
ByteOut.prototype.byte=function(b){ this.grow(1); this.buf[this.n++]=b&255; };
ByteOut.prototype.u16=function(v){ this.byte(v&255); this.byte((v>>8)&255); };
ByteOut.prototype.str=function(s){ for(var i=0;i<s.length;i++) this.byte(s.charCodeAt(i)); };
ByteOut.prototype.arr=function(a,len){ len=len==null?a.length:len; this.grow(len); for(var i=0;i<len;i++) this.buf[this.n++]=a[i]; };
ByteOut.prototype.result=function(){ return this.buf.slice(0,this.n); };

function quantize(rgba){
  var n=rgba.length>>2, keys=new Uint16Array(n), hist=new Uint32Array(32768);
  for(var i=0,j=0;i<n;i++,j+=4){ var k=((rgba[j]>>3)<<10)|((rgba[j+1]>>3)<<5)|(rgba[j+2]>>3); keys[i]=k; hist[k]++; }
  var bins=[]; for(var k2=0;k2<32768;k2++) if(hist[k2]) bins.push(k2);
  function comp(k,a){ return a===0?(k>>10)&31:(a===1?(k>>5)&31:k&31); }
  function mkBox(list){ var mn=[31,31,31],mx=[0,0,0],cnt=0; for(var i=0;i<list.length;i++){ var k=list[i]; cnt+=hist[k]; for(var a=0;a<3;a++){ var v=comp(k,a); if(v<mn[a])mn[a]=v; if(v>mx[a])mx[a]=v; } }
    var ax=0,rg=-1; for(var a2=0;a2<3;a2++){ var r=mx[a2]-mn[a2]; if(r>rg){rg=r;ax=a2;} } return {list:list,cnt:cnt,axis:ax,range:rg}; }
  var boxes=[mkBox(bins)];
  while(boxes.length<256){
    var bi=-1,best=0; for(var b=0;b<boxes.length;b++){ var bx=boxes[b]; if(bx.list.length<2||bx.range<=0) continue; var sc=bx.range*bx.cnt; if(sc>best){best=sc;bi=b;} }
    if(bi<0) break;
    var box=boxes[bi], ax=box.axis; box.list.sort(function(p,q){ return comp(p,ax)-comp(q,ax); });
    var half=box.cnt/2, acc=0, cut=1; for(var m=0;m<box.list.length-1;m++){ acc+=hist[box.list[m]]; if(acc>=half){ cut=m+1; break; } cut=m+1; }
    boxes.splice(bi,1,mkBox(box.list.slice(0,cut)),mkBox(box.list.slice(cut)));
  }
  var pal=new Uint8Array(768), lut=new Uint8Array(32768);
  for(var p=0;p<boxes.length;p++){ var L=boxes[p].list, sr=0,sg=0,sb=0,c=0;
    for(var q=0;q<L.length;q++){ var kk=L[q], h=hist[kk]; sr+=comp(kk,0)*h; sg+=comp(kk,1)*h; sb+=comp(kk,2)*h; c+=h; lut[kk]=p; }
    pal[p*3]=Math.round(sr/c*255/31); pal[p*3+1]=Math.round(sg/c*255/31); pal[p*3+2]=Math.round(sb/c*255/31); }
  var idx=new Uint8Array(n); for(var t=0;t<n;t++) idx[t]=lut[keys[t]];
  return {palette:pal, indices:idx};
}

function lzw(out,indices,minCode){
  out.byte(minCode);
  var clear=1<<minCode, eoi=clear+1, size=minCode+1, next=eoi+1, dict=new Map();
  var cur=0, bits=0, blk=new Uint8Array(255), bl=0;
  function emit(code){ cur|=code<<bits; bits+=size; while(bits>=8){ blk[bl++]=cur&255; cur>>>=8; bits-=8; if(bl===255){ out.byte(255); out.arr(blk,255); bl=0; } } }
  emit(clear);
  var prefix=indices[0];
  for(var i=1;i<indices.length;i++){
    var k=indices[i], key=(prefix<<8)|k, v=dict.get(key);
    if(v!==undefined){ prefix=v; continue; }
    emit(prefix);
    if(next===4096){ emit(clear); dict.clear(); next=eoi+1; size=minCode+1; }
    else { if(next>=(1<<size)) size++; dict.set(key,next++); }
    prefix=k;
  }
  emit(prefix); emit(eoi);
  if(bits>0){ blk[bl++]=cur&255; }
  if(bl){ out.byte(bl); out.arr(blk,bl); }
  out.byte(0);
}

function GifEncoder(w,h){ this.w=w; this.h=h; this.out=new ByteOut(); var o=this.out;
  o.str("GIF89a"); o.u16(w); o.u16(h); o.byte(0x70); o.byte(0); o.byte(0);           // no global table
  o.byte(0x21); o.byte(0xFF); o.byte(11); o.str("NETSCAPE2.0"); o.byte(3); o.byte(1); o.u16(0); o.byte(0); // loop forever
}
GifEncoder.prototype.addFrame=function(rgba,delayCs){ var o=this.out, q=quantize(rgba);
  o.byte(0x21); o.byte(0xF9); o.byte(4); o.byte(0x04); o.u16(delayCs); o.byte(0); o.byte(0);   // GCE: disposal=1 (leave)
  o.byte(0x2C); o.u16(0); o.u16(0); o.u16(this.w); o.u16(this.h); o.byte(0x87);             // local table, 256 colours
  o.arr(q.palette,768); lzw(o,q.indices,8); };
GifEncoder.prototype.finish=function(){ this.out.byte(0x3B); return this.out.result(); };

// =====================================================================
//  DREAM GENERATOR — DeepDream trading cards with endless zooms.
//  Runs InceptionV1 (GoogLeNet -- the original DeepDream model) in the browser
//  with TensorFlow.js on whichever engine benchmarks fastest on this device
//  (WebGPU / WebGL = GPU, WASM / JS = CPU).
//  Model files: models/inceptionv1/  (make them with tools/export_inceptionv1.py)
// =====================================================================

// ===== CONFIG =====
// ===== DREAM MODELS =====
// Each area of the game dreams on its own model. ?town= picks the area (see AREAS below);
// the area picks the model. To add a model: export it to models/<name>/, add an entry here,
// then point an area at it.
const MODELS = {
  v1: { short:"v1", label:"Inception v1", kind:"graph", url:"models/inceptionv1/model.json", pre:"v1",
        layers:["mixed3a","mixed3b","mixed4a","mixed4b","mixed4c","mixed4d","mixed4e","mixed5a","mixed5b"],
        pref:["mixed4c","mixed4d"],
        note:"Low layers (mixed3a) make swirls and textures; mid layers (mixed4c/4d) make the classic eyes-and-creatures; high layers (mixed5b) make abstract shapes." },
  v3: { short:"v3", label:"Inception v3", kind:"layers", url:"models/inceptionv3/model.json", pre:"v3",
        layers:["mixed2","mixed3","mixed4","mixed5","mixed6","mixed7"],
        pref:["mixed6","mixed7"],
        note:"Low layers (mixed2–3) make swirls and textures; high layers (mixed6–7) make eyes, fur and creature faces." },
  v2: { short:"v2", label:"Inception v2", kind:"graph", url:"models/inceptionv2/model.json", pre:"v2",
        layers:["InceptionV2/InceptionV2/Mixed_3b/concat","InceptionV2/InceptionV2/Mixed_3c/concat","InceptionV2/InceptionV2/Mixed_4a/concat","InceptionV2/InceptionV2/Mixed_4b/concat","InceptionV2/InceptionV2/Mixed_4c/concat","InceptionV2/InceptionV2/Mixed_4d/concat","InceptionV2/InceptionV2/Mixed_4e/concat","InceptionV2/InceptionV2/Mixed_5a/concat","InceptionV2/InceptionV2/Mixed_5b/concat","InceptionV2/InceptionV2/Mixed_5c/concat"],
        pref:["InceptionV2/InceptionV2/Mixed_4d/concat","InceptionV2/InceptionV2/Mixed_4e/concat"],
        note:"Low layers (Mixed_3b) make swirls and textures; mid layers (Mixed_4c–4e) make the classic eyes-and-creatures; high layers (Mixed_5c) make abstract shapes." },
  // Template for the next model (VGG16, ResNet50, …). Same export pattern as tools/export_inceptionv3.py.
  // vgg16: { short:"vgg16", label:"VGG16", kind:"layers", url:"models/vgg16/model.json", pre:"vgg",
  //          layers:["block1_conv2","block2_conv2","block3_conv3","block4_conv3","block5_conv3"],
  //          pref:["block4_conv3"],
  //          note:"Early blocks make painterly textures; deep blocks make flowing organic shapes." },
};
// Per-model pixel math. v1 (original DeepDream graph) works on pixels minus 117;
// v2 (TF-Slim) and v3 (Keras) work on pixels scaled to [-1,1].
const PRE = {
  v1: { norm:t=>t.sub(117),          denorm:t=>t.add(117).div(255), lo:-117, hi:138, noise:[-10,10] },
  v3: { norm:t=>t.div(127.5).sub(1), denorm:t=>t.add(1).div(2),     lo:-1,   hi:1,   noise:[-1,1] },
  v2: { norm:t=>t.div(127.5).sub(1), denorm:t=>t.add(1).div(2),     lo:-1,   hi:1,   noise:[-1,1] },
};
const WASM_PATH = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/";
const TOWN_FILE = "index.html?ret=1";
const QUALITY = { fast:{w:160,h:260}, normal:{w:224,h:364}, high:{w:288,h:468}, max:{w:384,h:624} };
const OCTAVES = 3, OCTAVE_SCALE = 1.35, JITTER = 16;
const MAX_FRAMES = 1000, PLAY_FPS = 12, GIF_W = 360, VIDEO_W = 540; // MAX_FRAMES = total a card can hold across multiple Zoom presses; the Settings slider caps each press at 100
// Playback: frames per second and "zoomerang" (zoom in, then back out to the start)
function clampFps(v){ v=parseFloat(v); if(!(v>0)) v=PLAY_FPS; return Math.max(2,Math.min(60,v)); }
function cardFps(c){ return clampFps(c&&c.playFps); }
function cardFpsOut(c){ return clampFps(c&&c.playFpsOut!=null?c.playFpsOut:cardFps(c)); }
// Frame index for elapsed seconds, honoring separate zoom-in / zoom-out speeds on the zoomerang.
function boomFrame(c,tSec){
  const n=c.frames.length, fi=cardFps(c), fo=cardFpsOut(c);
  if(!(cardBoom(c)&&n>2)) return Math.floor(tSec*fi)%n;
  const tIn=n/fi, tOut=(n-2)/fo, tc=tSec%(tIn+tOut);
  if(tc<tIn) return Math.min(n-1,Math.floor(tc*fi+1e-6));
  return Math.max(1,(n-2)-Math.floor((tc-tIn)*fo+1e-6));
}
// 0 = zoom-in leg, 1 = zoom-out leg, for output frame i of an exported sequence.
function seqLeg(c,i){ const n=c.frames.length; if(!(cardBoom(c)&&n>2)) return 0; return (i%(2*n-2))>=n?1:0; }
function cardBoom(c){ return !c||c.boomerang!==false; }
function seqLength(c){ const n=c.frames.length; return (cardBoom(c)&&n>2)?2*n-2:n; }
function seqFrame(c,k){ const n=c.frames.length; if(!(cardBoom(c)&&n>2)) return k%n; const p=2*n-2, m=k%p; return m<n?m:p-m; }
const AREAS = {   // must match AREAS in index.html; each area dreams on its own model (see MODELS)
  "map":   { first:1,  last:11, name:"Dream Core",   model:"v1" },
  "woods": { first:12, last:22, name:"Waking Woods", model:"v2" },
  "area3": { first:23, last:33, name:"Area 3",       model:"v3" }
};
// Each zoom frame crops by zoomFactor around a centre that moves along the chosen path,
// resizes back up, then runs `steps` gradient-ascent steps at learning rate `lr`.
const DEFAULTS = { path:"straight", frames:60, zoomFactor:0.97, steps:8, lr:0.04, range:0.08, segFrames:10, startSteps:0, sharpen:0.35, layers:["mixed4b","mixed4c"], quality:"", heat:"balanced" };
const PRESETS = [
  // Tuned for phone-sized dreams: stronger pushes and faster zooms so the effect really shows.
  { m:"v1", name:"Wild dive (straight)",      s:{ path:"straight", frames:60, zoomFactor:0.96,  steps:8,  lr:0.045, startSteps:0, sharpen:0.35, layers:["mixed4a","mixed4b"] } },
  { m:"v1", name:"Eye storm (square)",        s:{ path:"square",   frames:80, zoomFactor:0.97,  steps:10, lr:0.05,  range:0.10, segFrames:8,  startSteps:0, sharpen:0.35, layers:["mixed4c","mixed4d"] } },
  { m:"v1", name:"Triangle trip",             s:{ path:"triangle", frames:90, zoomFactor:0.97,  steps:8,  lr:0.045, range:0.12, segFrames:10, startSteps:0, sharpen:0.35, layers:["mixed4a","mixed4d"] } },

let wasmPathSet=false;
async function tryBackend(name){
  try{
    if(!(name in tf.engine().registryFactory)) return false;
    if(name==="wasm" && !wasmPathSet && tf.wasm && tf.wasm.setWasmPaths){ tf.wasm.setWasmPaths(WASM_PATH); wasmPathSet=true; }
    if(name==="webgpu" && !navigator.gpu) return false;
    const ok=await tf.setBackend(name); if(!ok) return false; await tf.ready();
    return tf.getBackend()===name;
  }catch(e){ console.warn("Backend "+name+" unavailable:",e); return false; }
}
async function bench(name){
  if(!(await tryBackend(name))) return Infinity;
  try{
    const a=tf.randomNormal([1,96,96,48]), f=tf.randomNormal([3,3,48,48]);
    const gf=tf.grad(z=>tf.conv2d(z,f,1,"same").relu().mean());
    const run=async()=>{ const g=gf(a); await g.data(); g.dispose(); };
    await run(); const t0=performance.now(); for(let i=0;i<3;i++) await run();
    a.dispose(); f.dispose(); return (performance.now()-t0)/3;
  }catch(e){ console.warn("Benchmark failed on "+name,e); return Infinity; }
}
async function pickEngines(){
  try{ const c=JSON.parse(localStorage.getItem(ENGINE_KEY)||"null"); if(c && Array.isArray(c.order) && c.order.length) return c.order; }catch(e){}
  const cands=["webgpu","webgl","wasm"], times={};
  for(const n of cands){ setStatus("Testing "+LABEL[n]+"…"); times[n]=await bench(n); }
  const order=cands.filter(n=>isFinite(times[n])).sort((a,b)=>times[a]-times[b]); order.push("cpu");
  try{ localStorage.setItem(ENGINE_KEY,JSON.stringify({order:order,times:times})); }catch(e){}
  return order;
}
// NOTE: the old InceptionV3 build needed patchBatchNorm() because its Keras
// batch-norm layers had no gamma weight. The InceptionV1 frozen graph is a pure
// inference graph (batch norm folded into constants), so no patching is needed.
// InceptionV3's batch-norm layers have no "scale" (gamma) weight; TF.js gradients crash on that
// ("reading 'dataId'"). A gamma of all ones changes nothing in the maths and fixes it.
function patchBatchNorm(m){
  for(const l of m.layers){
    if(l.getClassName()!=="BatchNormalization" || l.scale || l.gamma) continue;
    const c=l.movingMean.shape[l.movingMean.shape.length-1];
    l.gamma=l.addWeight("gamma",[c],"float32",tf.initializers.ones(),null,false); l.scale=true;
  }
}
async function activate(name){
  if(model){ model.dispose(); model=null; } grads={}; if(cur){ cur.dispose(); cur=null; }
  if(!(await tryBackend(name))) throw new Error(name+" unavailable");
  $("engineBtn").textContent="Engine: "+LABEL[name];
  setStatus("Loading "+MODEL.label+" on "+LABEL[name]+"…"); setBar(0);
  try{
    if(MODEL.kind==="layers"){ model=await tf.loadLayersModel(MODEL.url,{onProgress:p=>setBar(p)}); patchBatchNorm(model); }
    else { model=await tf.loadGraphModel(MODEL.url,{onProgress:p=>setBar(p)}); }
  }
  catch(e){ throw new Error("loading the model failed: "+(e&&e.message||e)); }
  if(MODEL.kind==="layers"){
    modelLayers=(model.outputNames&&model.outputNames.length)?model.outputNames.slice():model.outputs.map(o=>o.sourceLayer.name);
  }else{
    // Keep only the dream layers this model actually exposes. TF.js names graph
    // outputs like "mixed4c:0"; execute() accepts the short form too.
    const have=(model.outputs||[]).map(o=>o.name);
    modelLayers=MODEL.layers.filter(n=>have.indexOf(n)>=0||have.indexOf(n+":0")>=0);
  }

}

// ===== DEEPDREAM CORE =====
function activeLayers(){
  const want=(settings.layers&&settings.layers.length)?settings.layers:null;
  let use=want?modelLayers.filter(n=>want.indexOf(n)>=0):[];
  if(!use.length){ const pref=(MODEL.pref||[]).filter(n=>modelLayers.indexOf(n)>=0); use=pref.length?pref:modelLayers.slice(-2); }
  return use;
}
function getGrad(){
  const use=activeLayers(), key=use.join("+");
  if(grads[key]) return grads[key];
  if(MODEL.kind==="layers"){
    const idx=use.map(n=>modelLayers.indexOf(n));
    return grads[key]=tf.grad(img=>{
      let outs=model.apply(img,{training:false}); if(!Array.isArray(outs)) outs=[outs];
      let loss=null; for(const i of idx){ const l=tf.mean(outs[i]); loss=loss?loss.add(l):l; }
      return loss;
    });
  }
  return grads[key]=tf.grad(img=>{
    let outs=model.execute(img,use); if(!Array.isArray(outs)) outs=[outs];
    let loss=null; for(const o of outs){ const l=tf.mean(o); loss=loss?loss.add(l):l; }
    return loss;
  });
}
function roll(t,shift,axis){ const n=t.shape[axis]; shift=((shift%n)+n)%n; if(!shift) return t; const p=tf.split(t,[n-shift,shift],axis); return tf.concat([p[1],p[0]],axis); }
function dreamStep(img,lr){
  return tf.tidy(()=>{
    const sy=Math.floor((Math.random()*2-1)*JITTER), sx=Math.floor((Math.random()*2-1)*JITTER);
    let g=getGrad()(roll(roll(img,sy,1),sx,2));
    g=roll(roll(g,-sy,1),-sx,2);
    const std=tf.moments(g).variance.sqrt();
    return img.add(g.div(std.add(1e-8)).mul(lr)).clipByValue(P.lo,P.hi);
  });
}
// Zoom path offsets in pixels: straight stays centred, square and triangle trace their shape.
function pathOffset(n,w,h,s){
  const seg=Math.max(1,Math.round(s.segFrames)), sub=(n%seg)/seg;
  if(s.path==="square"){
    const rx=w*s.range/2, ry=h*s.range/2, ph=Math.floor((n%(4*seg))/seg);
    if(ph===0) return [-rx+2*rx*sub, -ry];
    if(ph===1) return [rx, -ry+2*ry*sub];
    if(ph===2) return [rx-2*rx*sub, ry];
    return [-rx, ry-2*ry*sub];
  }
  if(s.path==="triangle"){
    const rx=w*s.range/2, ry=h*s.range/2, ph=Math.floor((n%(3*seg))/seg);
    const v=[[0,-ry],[rx*Math.sqrt(3)/2,ry/2],[-rx*Math.sqrt(3)/2,ry/2]], a=v[ph], b=v[(ph+1)%3];
    return [a[0]+(b[0]-a[0])*sub, a[1]+(b[1]-a[1])*sub];
  }
  return [0,0];
}
function zoomCrop(img,zf,ox,oy,sharpen){
  return tf.tidy(()=>{
    const h=img.shape[1], w=img.shape[2], z=Math.max(0.5,Math.min(1,zf));
    const ch=Math.max(16,Math.round(h*z)), cw=Math.max(16,Math.round(w*z)), dy=Math.round(oy), dx=Math.round(ox);
    if(ch===h && cw===w){
      // Too small to zoom at this size: just pan by whole pixels (no resampling, so no blur).
      if(!dx && !dy) return img.clone();
      const p=Math.min(Math.max(Math.abs(dx),Math.abs(dy)),Math.min(h,w)-1);
      return tf.mirrorPad(img,[[0,0],[p,p],[p,p],[0,0]],"reflect").slice([0,p+Math.max(-p,Math.min(p,dy)),p+Math.max(-p,Math.min(p,dx)),0],[1,h,w,3]);
    }
    const y0=Math.max(0,Math.min(h-ch,Math.round((h-ch)/2+oy))), x0=Math.max(0,Math.min(w-cw,Math.round((w-cw)/2+ox)));
    let out=tf.image.resizeBilinear(img.slice([0,y0,x0,0],[1,ch,cw,3]),[h,w],false,true);
    if(sharpen>0){   // unsharp mask to cancel the resize blur

      const blur=tf.depthwiseConv2d(out,ker,1,"same");
      out=out.add(out.sub(blur).mul(sharpen*2)).clipByValue(P.lo,P.hi);
    }
    return out;
  });
}

async function renderSeedArt(seed,cv,w,h){

  for(let j=0;j<seed.comp.length;j++){ const im=await loadImg("dreamling"+seed.comp[j]+".png"); if(im) coverDraw(c,im,w,h,j===0?1:0.6); }
  c.fillStyle="rgba(6,4,20,0.2)"; c.fillRect(0,0,w,h);
  const op=seed.comp.length<=2?0.62:0.5, S=Math.min(w,h)*0.86;

    c.save(); c.globalAlpha=j===0?1:op; if(seed.kind==="dex") c.filter=tierFilter(seed.tier); c.imageSmoothingEnabled=false;

function readCollection(){
  const get=(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k)||d)||JSON.parse(d); }catch(e){ return JSON.parse(d); } };
  const fus=get("qu33phDLFusions","[]"), dex=get("qu33phDLDex","[]"), tier=get("town_tier","{}");
  const out=[];
  for(let i=fus.length-1;i>=0;i--){ const f=fus[i], comp=f.comp||[f.a,f.b]; if(!comp||!comp.length) continue;
    const tags=f.tags||[], best=tags.reduce((a,t)=>TIER_RANK[t]>TIER_RANK[a]?t:a,"red"), rr=f.rare==="full"?"blue":(f.rare==="half"?"green":"red");
    const top=TIER_RANK[best]>=TIER_RANK[rr]?best:rr;
    out.push({ kind:"fus", key:"f"+i+":"+comp.join("-"), comp:comp.slice(), name:fusNameArr(comp), rarity:top==="purple"?"blue":top, label:(comp.length>=4?"Deepdreamling":comp.length===3?"Tri-being":"Fusion")+" #"+comp.reduce((a,b)=>a+b,0) }); }
  dex.slice().sort((a,b)=>a-b).forEach(n=>{ const t=tier[n]||"red"; out.push({ kind:"dex", key:"d"+n, comp:[n], tier:t, name:dreamlingName(n), rarity:t==="purple"?"blue":t, label:"Dreamling #"+n }); });
  return out;
}

function styleLabel(){ return PATH_LABEL[settings.path]||"Zoom"; }

async function useSeed(seed){
  if(card && card.dirty && card.frames.length && !confirm("Switch cards? This dream isn't kept yet.")) return false;
  disposeCard();
  const q=dims();
  card={ id:"dc"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), no:0, name:seed.name, town:townKey, townName:town.name,

// ===== FRAMES (stored as JPEG blobs, decoded on demand so long zooms don't eat memory) =====
function toBlob(cv,type,q){ return new Promise(r=>cv.toBlob(r,type,q)); }
async function decodeBlob(b){ if(window.createImageBitmap){ try{ return await createImageBitmap(b); }catch(e){} } const u=URL.createObjectURL(b); const im=await loadImgFresh(u); URL.revokeObjectURL(u); return im; }
function loadImgFresh(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; }); }
const frameCache=new Map(); let decoding=new Set();
function cachedFrame(i){
  if(!card) return null;
  const hit=frameCache.get(i);
  const nn=card.frames.length;
  for(const k of [1,2,3,4,-1,-2,-3,-4]){ const j=((i+k)%nn+nn)%nn; if(!frameCache.has(j) && !decoding.has(j)){ decoding.add(j); const cid=card.id; decodeBlob(card.frames[j]).then(bm=>{ decoding.delete(j); if(card && card.id===cid) frameCache.set(j,bm); }); } }
  for(const k of Array.from(frameCache.keys())){ const d0=(k-i+nn)%nn, d=Math.min(d0,nn-d0); if(d>6 && k!==0){ const bm=frameCache.get(k); if(bm===lastArt) continue; if(bm&&bm.close) bm.close(); frameCache.delete(k); } }
  return hit||null;
}
function clearFrameCache(){ for(const bm of frameCache.values()) if(bm&&bm.close) bm.close(); frameCache.clear(); decoding=new Set(); }
async function pushFrame(){ const b=await toBlob(artCv,"image/jpeg",0.92); card.frames.push(b); card.dirty=true; }
function disposeCard(){ clearFrameCache(); lastArt=null; card=null; if(cur){ cur.dispose(); cur=null; } }

// ===== DREAM (starting dream, then zoom runs) =====
async function startDream(){
  if(!card||busy||!ready) return;
  busy=true; live=true; updateUI();
  if(!card.no) card.no=nextNumber();
  card.style=styleLabel()+" · "+layersLabel(); card.layers=activeLayers();
  const steps=Math.round(settings.startSteps), total=Math.max(1,steps*OCTAVES);
  card.recipe={ start:steps, startLayers:activeLayers().join("+"), startLr:+Math.max(0.01,settings.lr).toFixed(4), size:card.w+"×"+card.h, engine:ENGINE_SHORT[engineOrder[engineIdx]]||"GPU", runs:[] };
  for(;;){
    try{
      let img=tf.tidy(()=>{ let t=canvasToTensor(seedCv); if(steps>0) t=t.add(tf.randomUniform([1,card.h,card.w,3],P.noise[0],P.noise[1])).clipByValue(P.lo,P.hi); return t; });
      if(steps>0){ let done=0;
        for(let o=OCTAVES-1;o>=0;o--){
          const s=Math.pow(OCTAVE_SCALE,-o), h=Math.max(96,Math.round(card.h*s)), w=Math.max(96,Math.round(card.w*s));
          const r=tf.image.resizeBilinear(img,[h,w]); img.dispose(); img=r;
          for(let i=0;i<steps;i++){ const t0=performance.now(); const n=dreamStep(img,Math.max(0.01,settings.lr)); img.dispose(); img=n; done++;
            setStatus("Dreaming… detail layer "+(OCTAVES-o)+" of "+OCTAVES); setBar(done/total);
            if(i%3===2||i===steps-1) await tensorToCanvas(img,artCv); else await tf.nextFrame();
            if(o===0) noteStepTime(performance.now()-t0);
            const rest=HEAT_REST[settings.heat]||0; if(rest) await sleep((performance.now()-t0)*rest); }
        }
      }
      cur=img; break;
    }catch(e){
      console.error(e);
      if(!(await nextEngine())){ setStatus("Dreaming failed on every engine: "+(e&&e.message||e),true); setBar(null); busy=false; updateUI(); return; }
      setStatus("Switched to "+LABEL[engineOrder[engineIdx]]+" — trying again…");
    }
  }
  await tensorToCanvas(cur,artCv); await pushFrame();
  busy=false; live=false; setBar(null); playStart=performance.now();
  setStatus(card.name+" is dreaming. Press Zoom to fall in ("+styleLabel().toLowerCase()+", "+settings.frames+" frames).");
  updateUI();
}
async function ensureCur(){
  if(cur) return;
  const src=card.lastPng?await decodeBlob(card.lastPng):await decodeBlob(card.frames[card.frames.length-1]);
  tmpCv.width=card.w; tmpCv.height=card.h; const t=tmpCv.getContext("2d"); t.clearRect(0,0,card.w,card.h); t.drawImage(src,0,0,card.w,card.h);
  if(src&&src.close) src.close();
  cur=canvasToTensor(tmpCv);
}
async function zoomRun(){
  if(!card||busy||zooming||!card.frames.length) return;
  zooming=true; live=true; let failed=false, made=0; updateUI();
  artCv.width=card.w; artCv.height=card.h;
  const want=Math.max(1,Math.round(settings.frames));
  card.style=styleLabel()+" · "+layersLabel();
  if(!card.recipe) card.recipe={ start:0, size:card.w+"×"+card.h, engine:ENGINE_SHORT[engineOrder[engineIdx]]||"GPU", runs:[] };
  card.recipe.engine=ENGINE_SHORT[engineOrder[engineIdx]]||card.recipe.engine;
  const runSig={ path:settings.path, zf:+settings.zoomFactor, steps:Math.round(settings.steps), lr:+settings.lr, range:+settings.range, seg:Math.round(settings.segFrames), sharpen:+(settings.sharpen||0), layers:activeLayers().join("+") };
  const last=card.recipe.runs[card.recipe.runs.length-1], same=last&&["path","zf","steps","lr","range","seg","sharpen","layers"].every(k=>last[k]===runSig[k]);
  const run=same?last:Object.assign({frames:0},runSig); if(!same) card.recipe.runs.push(run);
  while(zooming && made<want && card.frames.length<MAX_FRAMES){
    try{
      await ensureCur();
      card.pathFrame=(card.pathFrame||0)+1;
      const off=pathOffset(card.pathFrame,card.w,card.h,settings);
      const z=zoomCrop(cur,settings.zoomFactor,off[0],off[1],settings.sharpen||0); cur.dispose(); cur=z;
      const t0=performance.now();
      for(let i=0;i<settings.steps;i++){ const n=dreamStep(cur,settings.lr); cur.dispose(); cur=n; }
      await tensorToCanvas(cur,artCv); noteStepTime((performance.now()-t0)/Math.max(1,settings.steps));
      await pushFrame(); card.lastPng=null; made++; run.frames++;
      const rest=HEAT_REST[settings.heat]||0; if(rest) await sleep((performance.now()-t0)*rest);
      setStatus(styleLabel()+"… frame "+made+" of "+want+" ("+card.frames.length+" on the card)"); setBar(made/want);
      await tf.nextFrame();
    }catch(e){
      console.error(e); if(cur){ cur.dispose(); cur=null; }
      if(!(await nextEngine())){ setStatus("Zoom failed: "+(e&&e.message||e),true); failed=true; break; }
      setStatus("Switched to "+LABEL[engineOrder[engineIdx]]+" — carrying on…");
    }
  }
  if(!failed){ if(card.frames.length>=MAX_FRAMES) setStatus("The card is full ("+MAX_FRAMES+" frames). Keep it or export it!"); else setStatus(card.frames.length+" frames on the card. Zoom again to keep falling, or tweak Settings first."); }
  zooming=false; live=false; setBar(null); playStart=performance.now(); updateUI();
}

function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
// Shrink the font until the text fits (down to minPx), then trim with … as a last resort.
function fitFont(c,t,maxW,px,minPx,weight,fam){ t=String(t||""); let s=px; for(;;){ c.font=(weight?weight+" ":"")+s+"px "+fam; if(c.measureText(t).width<=maxW||s<=minPx) break; s=Math.max(minPx,s*0.93); } return fitText(c,t,maxW); }
function wrapText(c,t,maxW){ const words=String(t||"").split(" "), lines=[]; let line=""; for(const w of words){ const test=line?line+" "+w:w; if(c.measureText(test).width<=maxW||!line) line=test; else { lines.push(line); line=w; } } if(line) lines.push(line); return lines; }
function fitText(c,t,maxW){ t=String(t||""); if(c.measureText(t).width<=maxW) return t; while(t.length>1 && c.measureText(t+"…").width>maxW) t=t.slice(0,-1); return t+"…"; }

// Which part of the recipe made frame `idx`: the starting dream (frame 0) or one of the zoom runs.
// Only that part is shown, so the text follows the zoom (and runs backwards with the zoomerang).
function recipeSegment(cd,idx){
  const r=cd.recipe; if(!r) return null;
  const runs=r.runs||[], f1=(cd.playFps||12), f2=(cd.playFpsOut!=null?cd.playFpsOut:f1);
  const foot=r.size+" on "+r.engine+" · plays "+f1+(cd.boomerang===false?"":"/"+f2)+" fps"+(cd.boomerang===false?"":" zoomerang");
  const total=1+runs.reduce((t,z)=>t+z.frames,0); if(idx>=total && runs.length) idx=total-1;
  let start=1;
  for(let i=0;i<runs.length;i++){ const z=runs[i];
    if(idx>=start && idx<start+z.frames){
      return { bullets:[
        "Zoom "+(i+1)+" of "+runs.length+": frame "+(idx-start+1)+" of "+z.frames,
        z.path[0].toUpperCase()+z.path.slice(1)+" zoom ×"+z.zf+" · "+z.steps+" steps · lr "+z.lr+(z.path!=="straight"?" · range "+z.range+", "+z.seg+" frames per side":"")+(z.sharpen?" · sharpen "+z.sharpen:""),
        "Layers "+z.layers.split("+").join(" + "),
        foot ],
        style:PATH_LABEL[z.path]+" · "+z.layers.split("+").join(" + ") };
    }
    start+=z.frames;
  }
  const L=(r.startLayers||"").split("+").join(" + ");
  return { bullets: r.start>0
      ? ["Starting dream: "+r.start+" steps × 3 sizes","lr "+r.startLr+" · layers "+L, runs.length?runs.length+" zoom run"+(runs.length>1?"s":"")+" follow":"No zoom yet", foot]
      : ["Starting card, no starting dream", runs.length?runs.length+" zoom run"+(runs.length>1?"s":"")+" follow":"No zoom yet", foot],
    style: r.start>0?"Starting dream · "+L:"Starting card" };
}

function processUserFrame(img){
  const cv=document.createElement("canvas"); cv.width=180; cv.height=320;
  const c=cv.getContext("2d");
  c.imageSmoothingEnabled=false; c.drawImage(img,0,0,180,320);
  const d=c.getImageData(0,0,180,320), p=d.data;
  const FP=[58,36,102];  // chroma-key purple -> rainbow holo foil shows through (old style)
  for(let i=0;i<p.length;i+=4){ if(Math.abs(p[i]-FP[0])+Math.abs(p[i+1]-FP[1])+Math.abs(p[i+2]-FP[2])<40) p[i+3]=0; }
  for(let y=26;y<286;y++) for(let x=10;x<170;x++) p[(y*180+x)*4+3]=0;  // art window clear
  const plate=(x0,y0,x1,y1)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const i=(y*180+x)*4;
      if((x===x0||x===x1)&&(y===y0||y===y1)){ p[i+3]=0; continue; }
      const edge=x===x0||x===x1||y===y0||y===y1, hi=y===y0+1&&x>x0+1&&x<x1-1;
      p[i]=edge?0:(hi?40:13); p[i+1]=edge?0:(hi?28:10); p[i+2]=edge?0:(hi?66:23); p[i+3]=255; } };

}

  resultExportId=exportId||null; $("delExportBtn").style.display=resultExportId?"":"none";
  resultBlob=blob; resultName=name; if(resultUrl) URL.revokeObjectURL(resultUrl); resultUrl=URL.createObjectURL(blob);
  const box=$("result"); box.innerHTML="";
  const el=document.createElement(kind==="gif"?"img":"video"); el.src=resultUrl;
  if(kind!=="gif"){ el.controls=true; el.loop=true; el.muted=true; el.playsInline=true; el.autoplay=true; }
  box.appendChild(el);
  $("resultTitle").textContent=name; $("resultHint").style.display=kind==="gif"?"block":"none";
  const f=new File([blob],name,{type:blob.type});
  $("shareBtn").style.display=(navigator.canShare&&navigator.canShare({files:[f]}))?"":"none";
  $("resultSheet").classList.add("open");
}
function fileBase(){ return (card.name+"-"+String(card.no||0).padStart(4,"0")).replace(/[^\w-]+/g,""); }
async function exportGif(){
  if(!card||busy||zooming||!card.frames.length) return;
  busy=true; updateUI();
  try{
    const W=GIF_W, H=Math.round(GIF_W*16/9), cv=document.createElement("canvas"); cv.width=W; cv.height=H; const c=cv.getContext("2d",{willReadFrequently:true});
    const n=card.frames.length, fpsIn=cardFps(card), fpsOut=cardFpsOut(card), L=seqLength(card);
    const dIn=Math.max(2,Math.round(100/fpsIn)), dOut=Math.max(2,Math.round(100/fpsOut)), count=Math.max(L,n===1?24:0);
    const enc=new GifEncoder(W,H); let im=null, imIdx=-1, tMs=0;
    for(let i=0;i<count;i++){
      const fi=seqFrame(card,i), dl=seqLeg(card,i)?dOut:dIn;
      if(fi!==imIdx){ if(im&&im.close) im.close(); im=await decodeBlob(card.frames[fi]); imIdx=fi; }
      drawCard(c,W,H,card,im,tMs,n,fi);
      enc.addFrame(c.getImageData(0,0,W,H).data,dl);
      tMs+=dl*10;
      setStatus("Making GIF… "+(i+1)+" / "+count); setBar((i+1)/count);
      if(i%2===1) await sleep(0);
    }
    if(im&&im.close) im.close();
    const gb=new Blob([enc.finish()],{type:"image/gif"}), gn=fileBase()+".gif"; const gid=await saveExport(gb,gn,"gif");
    showResult(gb,gn,"gif",gid); setStatus(gid?"GIF ready — also saved to your Gallery.":"GIF ready.");
  }catch(e){ console.error(e); setStatus("GIF export failed: "+(e&&e.message||e),true); }
  setBar(null); busy=false; updateUI();
}
function videoMime(){ if(!window.MediaRecorder) return null; const m=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"]; for(const t of m) if(MediaRecorder.isTypeSupported(t)) return t; return ""; }
async function exportVideo(){
  if(!card||busy||zooming||!card.frames.length) return;
  const mime=videoMime(); if(mime===null){ setStatus("This browser can't record video. Try the GIF instead.",true); return; }
  busy=true; updateUI();
  try{
    const cv=$("exportCv"), W=VIDEO_W, H=Math.round(VIDEO_W*16/9); cv.width=W; cv.height=H; const c=cv.getContext("2d");
    const n=card.frames.length, fpsIn=cardFps(card), fpsOut=cardFpsOut(card), L=seqLength(card);
    const cycSec=(cardBoom(card)&&n>2)?n/fpsIn+(n-2)/fpsOut:n/fpsIn, count=Math.max(L,Math.ceil(3/cycSec)*L);
    const imgs=[]; for(let i=0;i<n;i++){ imgs.push(await decodeBlob(card.frames[i])); setStatus("Preparing video… "+(i+1)+" / "+n); setBar((i+1)/n/2); if(i%10===9) await sleep(0); }
    drawCard(c,W,H,card,imgs[0],0,n,0);
    const stream=cv.captureStream(30), chunks=[];
    const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:5000000}:{videoBitsPerSecond:5000000});
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const stopped=new Promise(r=>rec.onstop=r); rec.start(250);
    const t0=performance.now(); let tMs=0;
    for(let i=0;i<count;i++){
      const fi=seqFrame(card,i), stepMs=seqLeg(card,i)?1000/fpsOut:1000/fpsIn;
      drawCard(c,W,H,card,imgs[fi],tMs,n,fi);
      setStatus("Recording video… "+(i+1)+" / "+count); setBar(0.5+(i+1)/count/2);
      tMs+=stepMs;
      await sleep(Math.max(0,t0+tMs-performance.now()));
    }
    await sleep(120); rec.stop(); await stopped; stream.getTracks().forEach(t=>t.stop());
    imgs.forEach(im=>{ if(im&&im.close) im.close(); });
    const type=(rec.mimeType||mime||"video/webm").split(";")[0], ext=type.indexOf("mp4")>=0?"mp4":"webm";
    const vb=new Blob(chunks,{type:type}), vn=fileBase()+"."+ext; const vid=await saveExport(vb,vn,"video");
    showResult(vb,vn,"video",vid); setStatus(vid?"Video ready — also saved to your Gallery.":"Video ready.");
  }catch(e){ console.error(e); setStatus("Video export failed: "+(e&&e.message||e),true); }
  setBar(null); busy=false; updateUI();
}
$("dlBtn").onclick=()=>{ const a=document.createElement("a"); a.href=resultUrl; a.download=resultName; document.body.appendChild(a); a.click(); a.remove(); };
$("shareBtn").onclick=async()=>{ try{ await navigator.share({files:[new File([resultBlob],resultName,{type:resultBlob.type})],title:resultName}); }catch(e){ if(e&&e.name!=="AbortError") setStatus("Sharing failed — use Download instead.",true); } };
$("resultClose").onclick=()=>{ $("resultSheet").classList.remove("open"); $("result").innerHTML=""; };
$("delExportBtn").onclick=async()=>{ if(!resultExportId||!confirm("Delete "+resultName+" from your Gallery?")) return; await idbDo("readwrite",st=>st.delete(resultExportId),EXPORTS); $("resultClose").onclick(); if($("gallery").classList.contains("open")) openGallery(); };

// ===== UI =====
function syncPlaybar(){
  const show=!!(card&&card.frames.length>1&&!live);
  $("playbar").classList.toggle("hide",!show);
  if(!card) return;
  const f=cardFps(card), fo=cardFpsOut(card), b=cardBoom(card);
  $("speed").value=f; $("speedVal").textContent=f+" fps";
  $("speedOut").value=fo; $("speedOutVal").textContent=fo+" fps"; $("speedOut").disabled=!b;
  $("boomBtn").classList.toggle("on",b); $("boomBtn").setAttribute("aria-pressed",b?"true":"false");
}
function playbarChanged(){ if(!card) return; if(card.saved) card.dirty=true; syncPlaybar(); updateUI(); }
$("speed").oninput=e=>{ if(!card) return; card.playFps=+e.target.value; $("speedVal").textContent=card.playFps+" fps"; };
$("speed").onchange=()=>playbarChanged();
$("speedOut").oninput=e=>{ if(!card) return; card.playFpsOut=+e.target.value; $("speedOutVal").textContent=card.playFpsOut+" fps"; };
$("speedOut").onchange=()=>playbarChanged();
$("boomBtn").onclick=()=>{ if(!card) return; card.boomerang=!cardBoom(card); playStart=performance.now(); playbarChanged(); };
function updateUI(){
  syncPlaybar();
  const p=$("primary"), has=!!(card&&card.frames.length);
  p.classList.toggle("stop",zooming);
  if(zooming){ p.textContent="Stop zooming"; p.disabled=false; }
  else if(has){ p.textContent=card.frames.length>=MAX_FRAMES?"Card is full":"Zoom ("+styleLabel().toLowerCase()+")"; p.disabled=busy||!ready||card.frames.length>=MAX_FRAMES; }
  else { p.textContent=card?"Dream this card":"Pick a card"; p.disabled=busy||(card&&!ready); }
  const idle=has&&!busy&&!zooming;
  $("pickBtn").disabled=busy||zooming; $("setBtn").disabled=zooming;
  $("keepBtn").disabled=!idle||(card.saved&&!card.dirty); $("keepBtn").textContent=(has&&card.saved)?(card.dirty?"Update":"Kept"):"Keep";
  $("gifBtn").disabled=!idle; $("vidBtn").disabled=!idle;
  $("galBtn").disabled=busy||zooming; $("engineBtn").disabled=busy||zooming;
}
$("primary").onclick=()=>{ if(zooming){ zooming=false; setStatus("Finishing this frame…"); } else if(card&&card.frames.length) zoomRun(); else if(card) startDream(); else openPicker(); };
$("pickBtn").onclick=openPicker; $("pickClose").onclick=closePicker;
$("setBtn").onclick=openSettings; $("setClose").onclick=closeSettings;
$("keepBtn").onclick=keepCard; $("gifBtn").onclick=exportGif; $("vidBtn").onclick=exportVideo;
$("galBtn").onclick=openGallery; $("galClose").onclick=closeGallery;
$("engineBtn").onclick=()=>{ if(busy||zooming) return; if(card&&card.dirty&&!confirm("Re-test engines? This reloads the page and the current dream isn't kept yet.")) return; try{ localStorage.removeItem(ENGINE_KEY); }catch(e){} location.reload(); };
function goTown(){ if(card&&card.dirty&&card.frames.length&&!confirm("Leave without keeping "+card.name+"?")) return; zooming=false; location.href=TOWN_FILE; }
$("backBtn").onclick=goTown;
addEventListener("keydown",e=>{
  const t=e.target&&e.target.tagName; if(t==="INPUT"||t==="SELECT") return;
  const open=["picker","settings","gallery","resultSheet"].filter(id=>$(id).classList.contains("open"));
  if(open.length){ if(e.key==="Escape"||e.key==="b"){ closePicker(); closeGallery(); if($("settings").classList.contains("open")) closeSettings(); $("resultClose").onclick(); } return; }
  if(e.key==="a"||e.key==="Enter"||e.key===" "){ if(document.activeElement&&document.activeElement.tagName==="BUTTON"&&e.key!=="a") return; e.preventDefault(); if(!$("primary").disabled) $("primary").onclick(); }
  else if(e.key==="b"||e.key==="Escape"){ goTown(); }
});

// ===== BOOT =====
async function boot(){
  layout(); requestAnimationFrame(tick); updateUI();
  // Show the newest card from your collection straight away (fusions first).
  const col=readCollection(); await useSeed(col.length?col[0]:wildSeed());
  setStatus(card.name+" popped out of your collection. Loading the dream engine…");
  if(typeof tf==="undefined"){ setStatus("Couldn't load TensorFlow.js. Check your internet connection and reload.",true); return; }
  let found=false; try{ const r=await fetch(MODEL.url,{cache:"no-cache"}); found=r.ok; }catch(e){}
  if(!found){ setStatus("Model not found at "+MODEL.url+" ("+MODEL.label+").",true); return; }
  try{ tf.enableProdMode(); }catch(e){}
  engineOrder=await pickEngines(); engineIdx=-1;
  if(!(await nextEngine())){ setStatus("The dream engine couldn't start. "+(engineErrors.length?engineErrors[engineErrors.length-1]:"No engine was available."),true); $("engineBtn").textContent="Engine: none"; return; }
  if(!QUALITY[settings.quality]){ settings.quality=(engineOrder[engineIdx]==="webgpu"||engineOrder[engineIdx]==="webgl")?"normal":"fast"; saveSettings(); }
  ready=true; card.style=styleLabel()+" · "+layersLabel();
  setStatus("Ready. "+card.name+" is loaded — press Dream this card, or pick another with Card.");
  updateUI();
}
boot();
</script>
