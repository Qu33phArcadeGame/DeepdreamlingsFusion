<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dreamlings · Dream Generator</title>
<style>
  :root{ --bg:#07040f; --panel:#120a22; --ink:#f1e9ff; --lav:#c9a0ff; --mint:#8affea; --pink:#ff8fbf; --dim:#8a78ad; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif;overflow:hidden;}
  body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    background:radial-gradient(ellipse at 50% 40%, #1c0f38 0%, var(--bg) 70%);}
  #app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:10px 14px 12px;gap:8px;}
  header{display:flex;align-items:center;gap:10px;}
  header h1{flex:1;margin:0;text-align:center;font-size:17px;letter-spacing:.02em;color:var(--lav);line-height:1.15;}
  header h1 small{display:block;font-size:12px;font-weight:normal;color:var(--mint);}
  button{font:inherit;color:var(--ink);background:#22143d;border:1px solid #3a2766;border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;}
  button:active{transform:translateY(1px);background:#2d1a52;}
  button:disabled{opacity:.38;cursor:default;transform:none;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px;}
  header button{font-size:13px;padding:8px 10px;white-space:nowrap;}
  main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  #card{display:block;touch-action:manipulation;}
  #statusWrap{min-height:36px;}
  #status{font-size:13px;color:var(--lav);text-align:center;line-height:1.35;min-height:18px;max-height:7.2em;overflow:auto;user-select:text;-webkit-user-select:text;word-break:break-word;}
  #status.err{color:#ffb3d1;}
  #bar{height:4px;border-radius:2px;background:#1d1233;margin-top:6px;overflow:hidden;visibility:hidden;}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lav),var(--mint));transition:width .15s;}
  #primary{width:100%;font-size:18px;font-weight:bold;padding:14px;border:none;color:#12081f;background:linear-gradient(135deg,var(--mint),var(--lav));}
  #primary.stop{background:linear-gradient(135deg,var(--pink),#ffb36b);}
  #row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  #row button{font-size:13px;padding:10px 2px;}
  footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);gap:8px;}
  footer button{background:none;border:none;color:var(--dim);padding:2px 0;font-size:12px;text-decoration:underline dotted;}
  #estimate{text-align:right;}
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(5,2,12,.95);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0)) 14px calc(12px + env(safe-area-inset-bottom,0));}
  .sheet.open{display:flex;}
  .sheet .top{display:flex;align-items:center;justify-content:space-between;max-width:560px;width:100%;margin:0 auto 10px;gap:10px;}
  .sheet h2{margin:0;font-size:17px;color:var(--lav);}
  .grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;max-width:560px;width:100%;margin:0 auto;align-content:start;}
  .grid h3{grid-column:1/-1;margin:6px 0 0;font-size:14px;color:var(--mint);font-weight:normal;}
  .tile{position:relative;background:none;border:none;padding:0;}
  .tile canvas{width:100%;height:auto;display:block;}
  .tile.sel canvas{outline:3px solid var(--mint);outline-offset:2px;border-radius:10px;}
  .tile .del{position:absolute;top:4px;right:4px;width:26px;height:26px;padding:0;border-radius:50%;font-size:13px;line-height:24px;background:rgba(10,5,20,.8);}
  .empty{grid-column:1/-1;color:var(--dim);text-align:center;margin-top:30px;font-size:14px;line-height:1.5;}
  #settingsBody{flex:1;overflow:auto;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:10px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;font-size:14px;padding:9px 4px;}
  .seg button.on{background:var(--lav);color:#12081f;border-color:var(--lav);font-weight:bold;}
  .field label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:4px;}
  .field label span{color:var(--dim);font-size:12px;}
  .field .ctl{display:flex;gap:10px;align-items:center;}
  .field input[type=range]{flex:1;accent-color:#c9a0ff;}
  .field input[type=number]{width:92px;font:inherit;font-size:14px;color:var(--ink);background:#1a1030;border:1px solid #3a2766;border-radius:8px;padding:6px;}
  .field.hide{display:none;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chips button{font-size:13px;padding:7px 10px;border-radius:18px;}
  .chips button.on{background:var(--mint);color:#08120e;border-color:var(--mint);font-weight:bold;}
  .note{font-size:12px;color:var(--dim);line-height:1.45;}
  select{font:inherit;font-size:14px;color:var(--ink);background:#1a1030;border:1px solid #3a2766;border-radius:8px;padding:7px;width:100%;}
  #result{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  #result img,#result video{max-width:100%;max-height:100%;border-radius:12px;}
  #resultBtns{display:flex;gap:10px;max-width:560px;width:100%;margin:12px auto 0;}
  #resultBtns button{flex:1;font-size:15px;}
  #resultHint{text-align:center;font-size:12px;color:var(--dim);margin-top:8px;}
  #exportCv{position:fixed;left:-10000px;top:0;pointer-events:none;}
  @media (prefers-reduced-motion: reduce){ #bar i{transition:none;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="backBtn" aria-label="Back to town">◀ Town</button>
    <h1>Dream Generator<small id="townName">&nbsp;</small></h1>
    <button id="galBtn">Gallery</button>
  </header>
  <main id="main"><canvas id="card" aria-label="Dream trading card"></canvas></main>

</div>

<div class="sheet" id="picker">

</div>

</div>

<div class="sheet" id="gallery">

  <div id="result"></div>
  <div id="resultBtns"><button id="dlBtn">Download</button><button id="shareBtn">Share</button></div>
  <div id="resultHint">On a phone you can also long-press the GIF to save it to your photos.</div>
</div>
<canvas id="exportCv"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.22.0/dist/tf-backend-webgpu.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.min.js"></script>
<script>
// ===== GIF ENCODER (median-cut palette per frame + LZW) =====
function ByteOut(){ this.buf=new Uint8Array(1<<16); this.n=0; }
ByteOut.prototype.grow=function(k){ if(this.n+k<=this.buf.length) return; var nb=new Uint8Array(Math.max(this.buf.length*2,this.n+k)); nb.set(this.buf.subarray(0,this.n)); this.buf=nb; };
ByteOut.prototype.byte=function(b){ this.grow(1); this.buf[this.n++]=b&255; };
ByteOut.prototype.u16=function(v){ this.byte(v&255); this.byte((v>>8)&255); };
ByteOut.prototype.str=function(s){ for(var i=0;i<s.length;i++) this.byte(s.charCodeAt(i)); };
ByteOut.prototype.arr=function(a,len){ len=len==null?a.length:len; this.grow(len); for(var i=0;i<len;i++) this.buf[this.n++]=a[i]; };
ByteOut.prototype.result=function(){ return this.buf.slice(0,this.n); };

function quantize(rgba){
  var n=rgba.length>>2, keys=new Uint16Array(n), hist=new Uint32Array(32768);
  for(var i=0,j=0;i<n;i++,j+=4){ var k=((rgba[j]>>3)<<10)|((rgba[j+1]>>3)<<5)|(rgba[j+2]>>3); keys[i]=k; hist[k]++; }
  var bins=[]; for(var k2=0;k2<32768;k2++) if(hist[k2]) bins.push(k2);
  function comp(k,a){ return a===0?(k>>10)&31:(a===1?(k>>5)&31:k&31); }
  function mkBox(list){ var mn=[31,31,31],mx=[0,0,0],cnt=0; for(var i=0;i<list.length;i++){ var k=list[i]; cnt+=hist[k]; for(var a=0;a<3;a++){ var v=comp(k,a); if(v<mn[a])mn[a]=v; if(v>mx[a])mx[a]=v; } }
    var ax=0,rg=-1; for(var a2=0;a2<3;a2++){ var r=mx[a2]-mn[a2]; if(r>rg){rg=r;ax=a2;} } return {list:list,cnt:cnt,axis:ax,range:rg}; }
  var boxes=[mkBox(bins)];
  while(boxes.length<256){
    var bi=-1,best=0; for(var b=0;b<boxes.length;b++){ var bx=boxes[b]; if(bx.list.length<2||bx.range<=0) continue; var sc=bx.range*bx.cnt; if(sc>best){best=sc;bi=b;} }
    if(bi<0) break;
    var box=boxes[bi], ax=box.axis; box.list.sort(function(p,q){ return comp(p,ax)-comp(q,ax); });
    var half=box.cnt/2, acc=0, cut=1; for(var m=0;m<box.list.length-1;m++){ acc+=hist[box.list[m]]; if(acc>=half){ cut=m+1; break; } cut=m+1; }
    boxes.splice(bi,1,mkBox(box.list.slice(0,cut)),mkBox(box.list.slice(cut)));
  }
  var pal=new Uint8Array(768), lut=new Uint8Array(32768);
  for(var p=0;p<boxes.length;p++){ var L=boxes[p].list, sr=0,sg=0,sb=0,c=0;
    for(var q=0;q<L.length;q++){ var kk=L[q], h=hist[kk]; sr+=comp(kk,0)*h; sg+=comp(kk,1)*h; sb+=comp(kk,2)*h; c+=h; lut[kk]=p; }
    pal[p*3]=Math.round(sr/c*255/31); pal[p*3+1]=Math.round(sg/c*255/31); pal[p*3+2]=Math.round(sb/c*255/31); }
  var idx=new Uint8Array(n); for(var t=0;t<n;t++) idx[t]=lut[keys[t]];
  return {palette:pal, indices:idx};
}

function lzw(out,indices,minCode){
  out.byte(minCode);
  var clear=1<<minCode, eoi=clear+1, size=minCode+1, next=eoi+1, dict=new Map();
  var cur=0, bits=0, blk=new Uint8Array(255), bl=0;
  function emit(code){ cur|=code<<bits; bits+=size; while(bits>=8){ blk[bl++]=cur&255; cur>>>=8; bits-=8; if(bl===255){ out.byte(255); out.arr(blk,255); bl=0; } } }
  emit(clear);
  var prefix=indices[0];
  for(var i=1;i<indices.length;i++){
    var k=indices[i], key=(prefix<<8)|k, v=dict.get(key);
    if(v!==undefined){ prefix=v; continue; }
    emit(prefix);
    if(next===4096){ emit(clear); dict.clear(); next=eoi+1; size=minCode+1; }
    else { if(next>=(1<<size)) size++; dict.set(key,next++); }
    prefix=k;
  }
  emit(prefix); emit(eoi);
  if(bits>0){ blk[bl++]=cur&255; }
  if(bl){ out.byte(bl); out.arr(blk,bl); }
  out.byte(0);
}

function GifEncoder(w,h){ this.w=w; this.h=h; this.out=new ByteOut(); var o=this.out;
  o.str("GIF89a"); o.u16(w); o.u16(h); o.byte(0x70); o.byte(0); o.byte(0);           // no global table
  o.byte(0x21); o.byte(0xFF); o.byte(11); o.str("NETSCAPE2.0"); o.byte(3); o.byte(1); o.u16(0); o.byte(0); // loop forever
}
GifEncoder.prototype.addFrame=function(rgba,delayCs){ var o=this.out, q=quantize(rgba);
  o.byte(0x21); o.byte(0xF9); o.byte(4); o.byte(0x04); o.u16(delayCs); o.byte(0); o.byte(0);   // GCE: disposal=1 (leave)
  o.byte(0x2C); o.u16(0); o.u16(0); o.u16(this.w); o.u16(this.h); o.byte(0x87);             // local table, 256 colours
  o.arr(q.palette,768); lzw(o,q.indices,8); };
GifEncoder.prototype.finish=function(){ this.out.byte(0x3B); return this.out.result(); };

// =====================================================================
//  DREAM GENERATOR — DeepDream trading cards with Colab-style zooms.
//  Runs InceptionV3 in the browser with TensorFlow.js on whichever engine
//  benchmarks fastest on this device (WebGPU / WebGL = GPU, WASM / JS = CPU).
//  Model files: models/inceptionv3/  (make them with tools/export_inceptionv3.py)
// =====================================================================

// ===== CONFIG =====
const MODEL_URL = "models/inceptionv3/model.json";
const WASM_PATH = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/";
const TOWN_FILE = "index.html?ret=1";
const QUALITY = { fast:{w:192,h:240}, normal:{w:256,h:320}, high:{w:320,h:400}, max:{w:432,h:540} };
const OCTAVES = 3, OCTAVE_SCALE = 1.35, JITTER = 16;
const MAX_FRAMES = 600, PLAY_FPS = 12, GIF_W = 300, VIDEO_W = 540;
const AREAS = {   // must match AREAS in index.html
  "map":   { first:1,  last:11, name:"Dream Core" },
  "woods": { first:12, last:22, name:"Waking Woods" }
};
// Same maths as your Colab notebook: each frame crops by zoomFactor around a centre that moves along
// the chosen path, resizes back up, then runs `steps` gradient-ascent steps at learning rate `lr`.
const DEFAULTS = { path:"straight", frames:60, zoomFactor:0.98, steps:4, lr:0.015, range:0.08, segFrames:10, startSteps:10, layers:null, quality:"" };
const PRESETS = [
  { name:"Game default (quick dive)", s:{ path:"straight", frames:60,  zoomFactor:0.98,   steps:4,  lr:0.015,  startSteps:10 } },
  { name:"Colab straight",            s:{ path:"straight", frames:330, zoomFactor:0.9999, steps:37, lr:0.067,  startSteps:0, layers:["mixed6","mixed7"] } },
  { name:"Colab square",              s:{ path:"square",   frames:330, zoomFactor:0.9999, steps:33, lr:0.0998, range:0.011, segFrames:5,  startSteps:0, layers:["mixed6","mixed7"] } },
  { name:"Colab square (lighter)",    s:{ path:"square",   frames:500, zoomFactor:0.999,  steps:7,  lr:0.0597, range:0.08,  segFrames:10, startSteps:0, layers:["mixed6","mixed7"] } },
  { name:"Colab triangle",            s:{ path:"triangle", frames:100, zoomFactor:0.999,  steps:10, lr:0.01,   range:0.1,   segFrames:20, startSteps:0, layers:["mixed6","mixed7"] } }
];
const FIELDS = [
  { k:"frames",     label:"Frames per run",       min:1,    max:600,  step:1,      note:"How many frames each press of Zoom makes (your Colab num_frames)." },
  { k:"zoomFactor", label:"Zoom factor",          min:0.9,  max:1,    step:0.0001, note:"Crop size each frame. 0.9999 barely moves, 0.98 dives fast." },
  { k:"steps",      label:"Steps per frame",      min:1,    max:50,   step:1,      note:"More steps = stronger dream, slower frames." },
  { k:"lr",         label:"Learning rate",        min:0.001,max:0.2,  step:0.0001, note:"How hard each step pushes the dream." },
  { k:"range",      label:"Movement range",       min:0,    max:0.3,  step:0.001,  paths:["square","triangle"], note:"How far the zoom centre drifts, as a fraction of the image." },
  { k:"segFrames",  label:"Frames per side",      min:1,    max:100,  step:1,      paths:["square","triangle"], note:"Frames spent on each side of the square or triangle." },
  { k:"startSteps", label:"Starting dream steps", min:0,    max:40,   step:1,      note:"Dreams the card at 3 sizes before zooming. 0 = start zooming straight from the card." }
];
const PATH_LABEL = { straight:"Straight zoom", square:"Square zoom", triangle:"Triangle zoom" };
const TIER_RANK = { red:0, green:1, blue:2, purple:3 };
const RARITY = {
  red:   { label:"Common", sym:"●", c1:"#ff5555", c2:"#6e1a2b" },
  green: { label:"Rare",   sym:"◆", c1:"#5dff8f", c2:"#15603a" },
  blue:  { label:"Holo",   sym:"★", c1:"#5db4ff", c2:"#2b2a8e" }
};
const ENGINE_KEY="dreamgen_engine_v1", SETTINGS_KEY="dreamgen_settings_v2", COUNT_KEY="dreamgen_count";
const LABEL = { webgpu:"WebGPU (GPU)", webgl:"WebGL (GPU)", wasm:"WebAssembly (CPU)", cpu:"JavaScript (CPU)" };

// ===== NAMES (same as the binder) =====
const DL_SYL1=["oo","vex","mo","glo","zu","fer","wis","kra","ny","sha","bl","gru","um","ith","qua","zel","pho","dra","ee","aur","tza","mir","ob","syl"];
const DL_SYL2=["na","tl","phi","ox","ba","ren","du","mo","sk","va","lo","th","ex","ir","um","al","oz","en","ix","ar","is","oon","el","yx"];
function dlRng(seed){ var s=(seed*2654435761)%2147483647; if(s<=0)s+=2147483646; return function(){ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function dreamlingName(id){ var r=dlRng(id*131+5); var a=DL_SYL1[Math.floor(r()*DL_SYL1.length)], b=DL_SYL2[Math.floor(r()*DL_SYL2.length)]; var nm=a+b+(r()<0.45?DL_SYL1[Math.floor(r()*DL_SYL1.length)]:""); return nm.charAt(0).toUpperCase()+nm.slice(1); }
function fusNameArr(comp){ var nm=""; for(var i=0;i<comp.length;i++){ var nn=dreamlingName(comp[i]); nm+=(i===0)?nn.slice(0,Math.ceil(nn.length/2)):nn.slice(Math.floor(nn.length/2)).toLowerCase(); } if(nm.length>20) nm=nm.slice(0,20); return nm.charAt(0).toUpperCase()+nm.slice(1); }

// ===== DOM / STATE =====
const $ = id => document.getElementById(id);
const cardCv=$("card"), cctx=cardCv.getContext("2d");
const artCv=document.createElement("canvas"), seedCv=document.createElement("canvas"), tmpCv=document.createElement("canvas");
const params=new URLSearchParams(location.search);
const townKey=AREAS[params.get("town")]?params.get("town"):"map", town=AREAS[townKey];
$("townName").textContent=town.name;

let model=null, modelLayers=[], grads={}, engineOrder=[], engineIdx=-1, engineErrors=[], ready=false, busy=false, zooming=false, live=false;
let card=null, cur=null, settings=loadSettings(), msPerStep=null;
let playStart=performance.now(), lastArt=null;

function loadSettings(){ let s={}; try{ s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}")||{}; }catch(e){} return Object.assign({},DEFAULTS,s); }
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings)); }catch(e){} updateEstimate(); }
function setStatus(t,err){ const s=$("status"); s.textContent=t; s.className=err?"err":""; }
function setBar(p){ const b=$("bar"); if(p==null){ b.style.visibility="hidden"; return; } b.style.visibility="visible"; b.firstChild.style.width=Math.round(Math.max(0,Math.min(1,p))*100)+"%"; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function dims(){ return QUALITY[settings.quality]||QUALITY.normal; }

// ===== ENGINE SELECTION =====
let wasmPathSet=false;
async function tryBackend(name){
  try{
    if(!(name in tf.engine().registryFactory)) return false;
    if(name==="wasm" && !wasmPathSet && tf.wasm && tf.wasm.setWasmPaths){ tf.wasm.setWasmPaths(WASM_PATH); wasmPathSet=true; }
    if(name==="webgpu" && !navigator.gpu) return false;
    const ok=await tf.setBackend(name); if(!ok) return false; await tf.ready();
    return tf.getBackend()===name;
  }catch(e){ console.warn("Backend "+name+" unavailable:",e); return false; }
}
async function bench(name){
  if(!(await tryBackend(name))) return Infinity;
  try{
    const a=tf.randomNormal([1,96,96,48]), f=tf.randomNormal([3,3,48,48]);
    const gf=tf.grad(z=>tf.conv2d(z,f,1,"same").relu().mean());
    const run=async()=>{ const g=gf(a); await g.data(); g.dispose(); };
    await run(); const t0=performance.now(); for(let i=0;i<3;i++) await run();
    a.dispose(); f.dispose(); return (performance.now()-t0)/3;
  }catch(e){ console.warn("Benchmark failed on "+name,e); return Infinity; }
}
async function pickEngines(){
  try{ const c=JSON.parse(localStorage.getItem(ENGINE_KEY)||"null"); if(c && Array.isArray(c.order) && c.order.length) return c.order; }catch(e){}
  const cands=["webgpu","webgl","wasm"], times={};
  for(const n of cands){ setStatus("Testing "+LABEL[n]+"…"); times[n]=await bench(n); }
  const order=cands.filter(n=>isFinite(times[n])).sort((a,b)=>times[a]-times[b]); order.push("cpu");
  try{ localStorage.setItem(ENGINE_KEY,JSON.stringify({order:order,times:times})); }catch(e){}
  return order;
}
// InceptionV3's batch-norm layers have no "scale" (gamma) weight; TF.js gradients crash on that
// ("reading 'dataId'"). A gamma of all ones changes nothing in the maths and fixes it.
function patchBatchNorm(m){
  for(const l of m.layers){
    if(l.getClassName()!=="BatchNormalization" || l.scale || l.gamma) continue;

// ===== DEEPDREAM CORE =====
function activeLayers(){
  const want=(settings.layers&&settings.layers.length)?settings.layers:null;
  let use=want?modelLayers.filter(n=>want.indexOf(n)>=0):[];
  if(!use.length){ const pref=["mixed6","mixed7"].filter(n=>modelLayers.indexOf(n)>=0); use=pref.length?pref:modelLayers.slice(-2); }
  return use;
}
function getGrad(){
  const use=activeLayers(), key=use.join("+");
  if(grads[key]) return grads[key];
  const idx=use.map(n=>modelLayers.indexOf(n));
  return grads[key]=tf.grad(img=>{
    let outs=model.apply(img,{training:false}); if(!Array.isArray(outs)) outs=[outs];
    let loss=null; for(const i of idx){ const l=tf.mean(outs[i]); loss=loss?loss.add(l):l; }
    return loss;
  });
}
function roll(t,shift,axis){ const n=t.shape[axis]; shift=((shift%n)+n)%n; if(!shift) return t; const p=tf.split(t,[n-shift,shift],axis); return tf.concat([p[1],p[0]],axis); }
function dreamStep(img,lr){
  return tf.tidy(()=>{
    const sy=Math.floor((Math.random()*2-1)*JITTER), sx=Math.floor((Math.random()*2-1)*JITTER);
    let g=getGrad()(roll(roll(img,sy,1),sx,2));
    g=roll(roll(g,-sy,1),-sx,2);
    const std=tf.moments(g).variance.sqrt();
    return img.add(g.div(std.add(1e-8)).mul(lr)).clipByValue(-1,1);
  });
}
// Zoom path offsets in pixels — ported from run_deep_dream_zoom_video in the Colab notebook.
function pathOffset(n,w,h,s){
  const seg=Math.max(1,Math.round(s.segFrames)), sub=(n%seg)/seg;
  if(s.path==="square"){
    const rx=w*s.range/2, ry=h*s.range/2, ph=Math.floor((n%(4*seg))/seg);
    if(ph===0) return [-rx+2*rx*sub, -ry];
    if(ph===1) return [rx, -ry+2*ry*sub];
    if(ph===2) return [rx-2*rx*sub, ry];
    return [-rx, ry-2*ry*sub];
  }
  if(s.path==="triangle"){
    const rx=w*s.range/2, ry=h*s.range/2, ph=Math.floor((n%(3*seg))/seg);
    const v=[[0,-ry],[rx*Math.sqrt(3)/2,ry/2],[-rx*Math.sqrt(3)/2,ry/2]], a=v[ph], b=v[(ph+1)%3];
    return [a[0]+(b[0]-a[0])*sub, a[1]+(b[1]-a[1])*sub];
  }
  return [0,0];
}
function zoomCrop(img,zf,ox,oy){
  return tf.tidy(()=>{
    const h=img.shape[1], w=img.shape[2], z=Math.max(0.5,Math.min(1,zf));
    let cy=0.5+oy/h, cx=0.5+ox/w; cy=Math.max(z/2,Math.min(1-z/2,cy)); cx=Math.max(z/2,Math.min(1-z/2,cx));
    if(z>=1 && !ox && !oy) return img.clone();
    const box=[cy-z/2,cx-z/2,cy+z/2,cx+z/2];
    try{ return tf.image.cropAndResize(img,tf.tensor2d([box]),tf.tensor1d([0],"int32"),[h,w],"bilinear"); }
    catch(e){ const y0=Math.round(box[0]*h), x0=Math.round(box[1]*w), ch=Math.max(1,Math.round(z*h)), cw=Math.max(1,Math.round(z*w)); return tf.image.resizeBilinear(img.slice([0,Math.min(y0,h-ch),Math.min(x0,w-cw),0],[1,ch,cw,3]),[h,w]); }
  });
}
function canvasToTensor(cv){ return tf.tidy(()=>tf.browser.fromPixels(cv).toFloat().div(127.5).sub(1).expandDims(0)); }

// ===== FRAMES (stored as JPEG blobs, decoded on demand so long zooms don't eat memory) =====
function toBlob(cv,type,q){ return new Promise(r=>cv.toBlob(r,type,q)); }

}

// ===== DREAM (starting dream, then Colab-style zoom runs) =====
async function startDream(){
  if(!card||busy||!ready) return;
  busy=true; live=true; updateUI();
  if(!card.no) card.no=nextNumber();
  card.style=styleLabel()+" · "+layersLabel(); card.layers=activeLayers();
  const steps=Math.round(settings.startSteps), total=Math.max(1,steps*OCTAVES);
  for(;;){
    try{
      let img=tf.tidy(()=>canvasToTensor(seedCv).add(tf.randomUniform([1,card.h,card.w,3],-0.04,0.04)).clipByValue(-1,1));
      if(steps>0){ let done=0;
        for(let o=OCTAVES-1;o>=0;o--){
          const s=Math.pow(OCTAVE_SCALE,-o), h=Math.max(96,Math.round(card.h*s)), w=Math.max(96,Math.round(card.w*s));
          const r=tf.image.resizeBilinear(img,[h,w]); img.dispose(); img=r;
          for(let i=0;i<steps;i++){ const t0=performance.now(); const n=dreamStep(img,Math.max(0.01,settings.lr)); img.dispose(); img=n; done++;
            setStatus("Dreaming… detail layer "+(OCTAVES-o)+" of "+OCTAVES); setBar(done/total);
            await tensorToCanvas(img,artCv); if(o===0) noteStepTime(performance.now()-t0); }
        }
      }
      cur=img; break;
    }catch(e){
      console.error(e);
      if(!(await nextEngine())){ setStatus("Dreaming failed on every engine: "+(e&&e.message||e),true); setBar(null); busy=false; updateUI(); return; }
      setStatus("Switched to "+LABEL[engineOrder[engineIdx]]+" — trying again…");
    }
  }
  await tensorToCanvas(cur,artCv); await pushFrame();
  busy=false; live=false; setBar(null); playStart=performance.now();
  setStatus(card.name+" is dreaming. Press Zoom to fall in ("+styleLabel().toLowerCase()+", "+settings.frames+" frames).");
  updateUI();
}
async function ensureCur(){

  tmpCv.width=card.w; tmpCv.height=card.h; const t=tmpCv.getContext("2d"); t.clearRect(0,0,card.w,card.h); t.drawImage(src,0,0,card.w,card.h);

async function zoomRun(){
  if(!card||busy||zooming||!card.frames.length) return;
  zooming=true; live=true; let failed=false, made=0; updateUI();
  artCv.width=card.w; artCv.height=card.h;
  const want=Math.max(1,Math.round(settings.frames));
  card.style=styleLabel()+" · "+layersLabel();
  while(zooming && made<want && card.frames.length<MAX_FRAMES){
    try{
      await ensureCur();
      card.pathFrame=(card.pathFrame||0)+1;
      const off=pathOffset(card.pathFrame,card.w,card.h,settings);
      const z=zoomCrop(cur,settings.zoomFactor,off[0],off[1]); cur.dispose(); cur=z;
      const t0=performance.now();
      for(let i=0;i<settings.steps;i++){ const n=dreamStep(cur,settings.lr); cur.dispose(); cur=n; }
      await tensorToCanvas(cur,artCv); noteStepTime((performance.now()-t0)/Math.max(1,settings.steps));
      await pushFrame(); card.lastPng=null; made++;
      setStatus(styleLabel()+"… frame "+made+" of "+want+" ("+card.frames.length+" on the card)"); setBar(made/want);
      await tf.nextFrame();

    }

}

}
function layout(){
  const m=$("main"), aw=m.clientWidth, ah=m.clientHeight;
  const hgt=Math.floor(Math.min(ah,aw*1.4)), wdt=Math.floor(hgt/1.4), dpr=Math.min(3,window.devicePixelRatio||1);
  cardCv.style.width=wdt+"px"; cardCv.style.height=hgt+"px"; cardCv.width=Math.round(wdt*dpr); cardCv.height=Math.round(hgt*dpr);
}
new ResizeObserver(layout).observe($("main"));

// ===== CARD PICKER =====
async function openPicker(){
  if(busy||zooming) return;
  const grid=$("pickGrid"); grid.innerHTML=""; $("picker").classList.add("open");
  const all=readCollection(), fus=all.filter(s=>s.kind==="fus"), dex=all.filter(s=>s.kind==="dex");
  const section=(title,list)=>{ if(!list.length) return; const h=document.createElement("h3"); h.textContent=title; grid.appendChild(h); list.forEach(addTile); };
  const addTile=seed=>{
    const tile=document.createElement("button"); tile.className="tile"+(card&&card.seedKey===seed.key?" sel":""); tile.setAttribute("aria-label","Dream "+seed.name);
    const cv=document.createElement("canvas"); cv.width=220; cv.height=308; tile.appendChild(cv); grid.appendChild(tile);
    const pseudo={name:seed.name,rarity:seed.rarity,detail:seed.label,style:"",townName:town.name,no:0};
    drawCard(cv.getContext("2d"),220,308,pseudo,null,0,0);
    const art=document.createElement("canvas"); renderSeedArt(seed,art,160,200).then(()=>drawCard(cv.getContext("2d"),220,308,pseudo,art,0,0));
    tile.onclick=async()=>{ if(await useSeed(seed)){ closePicker(); setStatus(seed.name+" is ready. Press Dream this card."); } };
  };
  section("Fusions",fus); section("Dreamlings",dex);
  if(!all.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="No dreamlings caught yet. Spin some slots in town, or dream a wild one:"; grid.appendChild(e); addTile(wildSeed()); }
}
function closePicker(){ $("picker").classList.remove("open"); }

// ===== SETTINGS SHEET =====
function buildSettings(){
  const body=$("settingsBody"); body.innerHTML="";
  const addNote=(txt)=>{ const n=document.createElement("div"); n.className="note"; n.textContent=txt; return n; };
  // presets
  const pw=document.createElement("div"); pw.className="field";
  pw.innerHTML='<label>Preset <span>from your Colab notebook</span></label>';
  const sel=document.createElement("select"); sel.innerHTML='<option value="">Choose a preset…</option>'+PRESETS.map((p,i)=>'<option value="'+i+'">'+p.name+'</option>').join("");
  sel.onchange=()=>{ if(sel.value==="") return; const p=PRESETS[+sel.value]; settings=Object.assign({},settings,DEFAULTS,{quality:settings.quality},p.s); saveSettings(); buildSettings(); setStatus("Preset: "+p.name); };
  pw.appendChild(sel); body.appendChild(pw);
  // path
  const pf=document.createElement("div"); pf.className="field"; pf.innerHTML="<label>Zoom path</label>";
  const seg=document.createElement("div"); seg.className="seg";
  ["straight","square","triangle"].forEach(p=>{ const b=document.createElement("button"); b.textContent=p[0].toUpperCase()+p.slice(1); b.className=settings.path===p?"on":""; b.onclick=()=>{ settings.path=p; saveSettings(); buildSettings(); }; seg.appendChild(b); });
  pf.appendChild(seg); body.appendChild(pf);
  // numbers
  FIELDS.forEach(f=>{
    const d=document.createElement("div"); d.className="field"+(f.paths&&f.paths.indexOf(settings.path)<0?" hide":"");
    const lab=document.createElement("label"); lab.textContent=f.label; d.appendChild(lab);
    const ctl=document.createElement("div"); ctl.className="ctl";
    const rg=document.createElement("input"); rg.type="range"; rg.min=f.min; rg.max=f.max; rg.step=f.step; rg.value=settings[f.k]; rg.setAttribute("aria-label",f.label);
    const nb=document.createElement("input"); nb.type="number"; nb.min=f.min; nb.max=f.max; nb.step=f.step; nb.value=settings[f.k]; nb.inputMode="decimal"; nb.setAttribute("aria-label",f.label+" value");
    const setV=v=>{ v=parseFloat(v); if(isNaN(v)) return; v=Math.max(f.min,Math.min(f.max,v)); settings[f.k]=v; saveSettings(); };
    rg.oninput=()=>{ nb.value=rg.value; setV(rg.value); };
    nb.onchange=()=>{ setV(nb.value); nb.value=settings[f.k]; rg.value=settings[f.k]; };
    ctl.appendChild(rg); ctl.appendChild(nb); d.appendChild(ctl); d.appendChild(addNote(f.note)); body.appendChild(d);
  });
  // layers
  const lf=document.createElement("div"); lf.className="field"; lf.innerHTML="<label>Inception layers <span>which features to amplify</span></label>";
  const chips=document.createElement("div"); chips.className="chips";
  const allNames=["mixed2","mixed3","mixed4","mixed5","mixed6","mixed7"], active=model?activeLayers():(settings.layers||[]);
  allNames.forEach(n=>{ const b=document.createElement("button"); b.textContent=n; const have=!model||modelLayers.indexOf(n)>=0;
    b.disabled=!have; b.className=active.indexOf(n)>=0&&have?"on":"";
    b.onclick=()=>{ let L=(model?activeLayers():(settings.layers||[])).slice(); const i=L.indexOf(n); if(i>=0){ if(L.length>1) L.splice(i,1); } else L.push(n); settings.layers=L; saveSettings(); buildSettings(); };
    chips.appendChild(b); });
  lf.appendChild(chips);
  lf.appendChild(addNote("Low layers (mixed2–3) make swirls and textures; high layers (mixed6–7) make eyes, fur and creature faces — your Colab uses mixed6 + mixed7."+
    (model&&modelLayers.indexOf("mixed7")<0?" mixed6 and mixed7 need the updated model: re-run “Build DeepDream model” in GitHub Actions.":"")));
  body.appendChild(lf);
  // quality
  const qf=document.createElement("div"); qf.className="field"; qf.innerHTML="<label>Dream size <span>bigger = sharper but slower</span></label>";
  const qs=document.createElement("select"); qs.innerHTML=Object.keys(QUALITY).map(k=>'<option value="'+k+'">'+k[0].toUpperCase()+k.slice(1)+" ("+QUALITY[k].w+"×"+QUALITY[k].h+")</option>").join("");
  qs.value=QUALITY[settings.quality]?settings.quality:"normal"; qs.onchange=()=>{ settings.quality=qs.value; saveSettings(); };
  qf.appendChild(qs); qf.appendChild(addNote("Applies to the next card you pick. Your Colab runs at 1080×1920 on a big GPU — a phone needs much smaller sizes.")); body.appendChild(qf);
  const reset=document.createElement("button"); reset.textContent="Reset to defaults"; reset.onclick=()=>{ settings=Object.assign({},DEFAULTS,{quality:settings.quality}); saveSettings(); buildSettings(); };
  body.appendChild(reset);
  updateEstimate();
}
function openSettings(){ if(zooming) return; buildSettings(); $("settings").classList.add("open"); }
function closeSettings(){ $("settings").classList.remove("open"); if(card) { card.style=styleLabel()+(model?" · "+layersLabel():""); } updateUI(); }

// ===== KEEP (IndexedDB) =====
const DB_NAME="deepdreamlings_generator", STORE="cards";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>{ r.result.createObjectStore(STORE,{keyPath:"id"}); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbDo(mode,fn){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,mode), st=tx.objectStore(STORE); const r=fn(st); tx.oncomplete=()=>res(r&&r.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }
function cardRecord(c){ return { id:c.id, no:c.no, name:c.name, town:c.town, townName:c.townName, rarity:c.rarity, style:c.style, detail:c.detail, seedKey:c.seedKey, w:c.w, h:c.h, created:c.created, pathFrame:c.pathFrame||0, frames:c.frames.slice(), lastPng:c.lastPng||null }; }
async function keepCard(){
  if(!card||busy||zooming||!card.frames.length) return;
  busy=true; updateUI(); setStatus("Keeping "+card.name+"…");
  try{
    if(cur){ tmpCv.width=card.w; tmpCv.height=card.h; await tensorToCanvas(cur,tmpCv); card.lastPng=await toBlob(tmpCv,"image/png"); }
    await idbDo("readwrite",st=>st.put(cardRecord(card)));
    card.saved=true; card.dirty=false; setStatus(card.name+" is in your Gallery.");
  }catch(e){ console.error(e); setStatus("Couldn't keep the card: "+(e&&e.message||e)+". Browser storage may be full — try exporting instead.",true); }
  busy=false; updateUI();
}

// ===== GALLERY =====
async function openGallery(){
  if(busy||zooming) return;
  const grid=$("grid"); grid.innerHTML=""; $("gallery").classList.add("open");
  let recs=[]; try{ recs=await idbDo("readonly",st=>st.getAll())||[]; }catch(e){ console.error(e); }
  recs.sort((a,b)=>b.created-a.created);
  if(!recs.length){ grid.innerHTML='<div class="empty">No kept cards yet. Dream one and press Keep.</div>'; return; }
  for(const r of recs){
    if(!r.detail && r.seed) r.detail="Seed #"+r.seed;
    const tile=document.createElement("button"); tile.className="tile"; tile.setAttribute("aria-label","Open "+r.name);
    const cv=document.createElement("canvas"); cv.width=220; cv.height=308; tile.appendChild(cv);
    const del=document.createElement("button"); del.className="del"; del.textContent="✕"; del.setAttribute("aria-label","Delete "+r.name); tile.appendChild(del);
    grid.appendChild(tile);
    drawCard(cv.getContext("2d"),220,308,r,null,0,r.frames.length);
    if(r.frames.length) decodeBlob(r.frames[0]).then(im=>{ if(im) drawCard(cv.getContext("2d"),220,308,r,im,0,r.frames.length); });
    tile.onclick=()=>openKept(r);
    del.onclick=async e=>{ e.stopPropagation(); if(!confirm("Delete "+r.name+"?")) return; await idbDo("readwrite",st=>st.delete(r.id)); if(card&&card.id===r.id) card.saved=false; openGallery(); };
  }
}
function closeGallery(){ $("gallery").classList.remove("open"); }
async function openKept(r){
  if(card && card.dirty && card.frames.length && card.id!==r.id && !confirm("Open "+r.name+"? The current dream isn't kept yet.")) return;
  closeGallery(); disposeCard();
  card=Object.assign({},r,{frames:r.frames.slice(),dirty:false,saved:true});
  const first=await decodeBlob(card.frames[0]); artCv.width=card.w; artCv.height=card.h; if(first){ artCv.getContext("2d").drawImage(first,0,0,card.w,card.h); }
  live=false; playStart=performance.now();
  setStatus(card.name+" · "+card.frames.length+" frames. Zoom to keep going.");
  updateUI();
}

// ===== EXPORT: GIF + VIDEO =====
let resultBlob=null, resultName="", resultUrl=null;
function showResult(blob,name,kind){
  resultBlob=blob; resultName=name; if(resultUrl) URL.revokeObjectURL(resultUrl); resultUrl=URL.createObjectURL(blob);
  const box=$("result"); box.innerHTML="";
  const el=document.createElement(kind==="gif"?"img":"video"); el.src=resultUrl;
  if(kind!=="gif"){ el.controls=true; el.loop=true; el.muted=true; el.playsInline=true; el.autoplay=true; }
  box.appendChild(el);
  $("resultTitle").textContent=name; $("resultHint").style.display=kind==="gif"?"block":"none";
  const f=new File([blob],name,{type:blob.type});
  $("shareBtn").style.display=(navigator.canShare&&navigator.canShare({files:[f]}))?"":"none";
  $("resultSheet").classList.add("open");
}
function fileBase(){ return (card.name+"-"+String(card.no||0).padStart(4,"0")).replace(/[^\w-]+/g,""); }
async function exportGif(){
  if(!card||busy||zooming||!card.frames.length) return;
  busy=true; updateUI();
  try{
    const W=GIF_W, H=Math.round(GIF_W*1.4), cv=document.createElement("canvas"); cv.width=W; cv.height=H; const c=cv.getContext("2d",{willReadFrequently:true});
    const enc=new GifEncoder(W,H), n=card.frames.length, delay=Math.round(100/PLAY_FPS), count=Math.max(n,n===1?24:0);
    let im=null;
    for(let i=0;i<count;i++){
      if(i<n){ if(im&&im.close) im.close(); im=await decodeBlob(card.frames[i]); }
      drawCard(c,W,H,card,im,i*1000/PLAY_FPS,n);
      enc.addFrame(c.getImageData(0,0,W,H).data,delay);
      setStatus("Making GIF… "+(i+1)+" / "+count); setBar((i+1)/count);
      if(i%2===1) await sleep(0);
    }
    if(im&&im.close) im.close();
    showResult(new Blob([enc.finish()],{type:"image/gif"}),fileBase()+".gif","gif"); setStatus("GIF ready.");
  }catch(e){ console.error(e); setStatus("GIF export failed: "+(e&&e.message||e),true); }
  setBar(null); busy=false; updateUI();
}
function videoMime(){ if(!window.MediaRecorder) return null; const m=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"]; for(const t of m) if(MediaRecorder.isTypeSupported(t)) return t; return ""; }
async function exportVideo(){
  if(!card||busy||zooming||!card.frames.length) return;
  const mime=videoMime(); if(mime===null){ setStatus("This browser can't record video. Try the GIF instead.",true); return; }
  busy=true; updateUI();
  try{
    const cv=$("exportCv"), W=VIDEO_W, H=Math.round(VIDEO_W*1.4); cv.width=W; cv.height=H; const c=cv.getContext("2d");
    const n=card.frames.length, count=Math.max(n,PLAY_FPS*3);
    const imgs=[]; for(let i=0;i<Math.min(n,count);i++){ imgs.push(await decodeBlob(card.frames[i])); setStatus("Preparing video… "+(i+1)+" / "+n); setBar((i+1)/n/2); if(i%10===9) await sleep(0); }
    drawCard(c,W,H,card,imgs[0],0,n);
    const stream=cv.captureStream(30), chunks=[];
    const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:5000000}:{videoBitsPerSecond:5000000});
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    const stopped=new Promise(r=>rec.onstop=r); rec.start(250);
    const t0=performance.now();
    for(let i=0;i<count;i++){
      drawCard(c,W,H,card,imgs[i%n],i*1000/PLAY_FPS,n);
      setStatus("Recording video… "+(i+1)+" / "+count); setBar(0.5+(i+1)/count/2);
      await sleep(Math.max(0,t0+(i+1)*1000/PLAY_FPS-performance.now()));
    }
    await sleep(120); rec.stop(); await stopped; stream.getTracks().forEach(t=>t.stop());
    imgs.forEach(im=>{ if(im&&im.close) im.close(); });
    const type=(rec.mimeType||mime||"video/webm").split(";")[0], ext=type.indexOf("mp4")>=0?"mp4":"webm";
    showResult(new Blob(chunks,{type:type}),fileBase()+"."+ext,"video"); setStatus("Video ready.");
  }catch(e){ console.error(e); setStatus("Video export failed: "+(e&&e.message||e),true); }
  setBar(null); busy=false; updateUI();
}
$("dlBtn").onclick=()=>{ const a=document.createElement("a"); a.href=resultUrl; a.download=resultName; document.body.appendChild(a); a.click(); a.remove(); };
$("shareBtn").onclick=async()=>{ try{ await navigator.share({files:[new File([resultBlob],resultName,{type:resultBlob.type})],title:resultName}); }catch(e){ if(e&&e.name!=="AbortError") setStatus("Sharing failed — use Download instead.",true); } };
$("resultClose").onclick=()=>{ $("resultSheet").classList.remove("open"); $("result").innerHTML=""; };

// ===== UI =====
function updateUI(){
  const p=$("primary"), has=!!(card&&card.frames.length);
  p.classList.toggle("stop",zooming);
  if(zooming){ p.textContent="Stop zooming"; p.disabled=false; }
  else if(has){ p.textContent=card.frames.length>=MAX_FRAMES?"Card is full":"Zoom ("+styleLabel().toLowerCase()+")"; p.disabled=busy||!ready||card.frames.length>=MAX_FRAMES; }
  else { p.textContent=card?"Dream this card":"Pick a card"; p.disabled=busy||(card&&!ready); }
  const idle=has&&!busy&&!zooming;
  $("pickBtn").disabled=busy||zooming; $("setBtn").disabled=zooming;
  $("keepBtn").disabled=!idle||(card.saved&&!card.dirty); $("keepBtn").textContent=(has&&card.saved)?(card.dirty?"Update":"Kept"):"Keep";
  $("gifBtn").disabled=!idle; $("vidBtn").disabled=!idle;
  $("galBtn").disabled=busy||zooming; $("engineBtn").disabled=busy||zooming;
}
$("primary").onclick=()=>{ if(zooming){ zooming=false; setStatus("Finishing this frame…"); } else if(card&&card.frames.length) zoomRun(); else if(card) startDream(); else openPicker(); };
$("pickBtn").onclick=openPicker; $("pickClose").onclick=closePicker;
$("setBtn").onclick=openSettings; $("setClose").onclick=closeSettings;
$("keepBtn").onclick=keepCard; $("gifBtn").onclick=exportGif; $("vidBtn").onclick=exportVideo;
$("galBtn").onclick=openGallery; $("galClose").onclick=closeGallery;
$("engineBtn").onclick=()=>{ if(busy||zooming) return; if(card&&card.dirty&&!confirm("Re-test engines? This reloads the page and the current dream isn't kept yet.")) return; try{ localStorage.removeItem(ENGINE_KEY); }catch(e){} location.reload(); };
function goTown(){ if(card&&card.dirty&&card.frames.length&&!confirm("Leave without keeping "+card.name+"?")) return; zooming=false; location.href=TOWN_FILE; }
$("backBtn").onclick=goTown;
addEventListener("keydown",e=>{
  const t=e.target&&e.target.tagName; if(t==="INPUT"||t==="SELECT") return;
  const open=["picker","settings","gallery","resultSheet"].filter(id=>$(id).classList.contains("open"));
  if(open.length){ if(e.key==="Escape"||e.key==="b"){ closePicker(); closeGallery(); if($("settings").classList.contains("open")) closeSettings(); $("resultClose").onclick(); } return; }
  if(e.key==="a"||e.key==="Enter"||e.key===" "){ if(document.activeElement&&document.activeElement.tagName==="BUTTON"&&e.key!=="a") return; e.preventDefault(); if(!$("primary").disabled) $("primary").onclick(); }
  else if(e.key==="b"||e.key==="Escape"){ goTown(); }
});

// ===== BOOT =====
async function boot(){
  layout(); requestAnimationFrame(tick); updateUI();
  // Show the newest card from your collection straight away (fusions first).
  const col=readCollection(); await useSeed(col.length?col[0]:wildSeed());
  setStatus(card.name+" popped out of your collection. Loading the dream engine…");
  if(typeof tf==="undefined"){ setStatus("Couldn't load TensorFlow.js. Check your internet connection and reload.",true); return; }
  let found=false; try{ const r=await fetch(MODEL_URL,{cache:"no-cache"}); found=r.ok; }catch(e){}
  if(!found){ setStatus("Model not found at "+MODEL_URL+". Run “Build DeepDream model” in GitHub Actions (see DREAM_GENERATOR.md).",true); return; }
  try{ tf.enableProdMode(); }catch(e){}
  engineOrder=await pickEngines(); engineIdx=-1;
  if(!(await nextEngine())){ setStatus("The dream engine couldn't start. "+(engineErrors.length?engineErrors[engineErrors.length-1]:"No engine was available."),true); $("engineBtn").textContent="Engine: none"; return; }
  if(!QUALITY[settings.quality]){ settings.quality=(engineOrder[engineIdx]==="webgpu"||engineOrder[engineIdx]==="webgl")?"normal":"fast"; saveSettings(); }
  ready=true; card.style=styleLabel()+" · "+layersLabel();
  setStatus("Ready. "+card.name+" is loaded — press Dream this card, or pick another with Card.");
  updateUI();
}
boot();
