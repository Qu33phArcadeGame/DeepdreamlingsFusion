<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Dreamlings · Dream Generator</title>
<style>
  :root{ --bg:#07040f; --panel:#120a22; --ink:#f1e9ff; --lav:#c9a0ff; --mint:#8affea; --pink:#ff8fbf; --dim:#8a78ad; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif;overflow:hidden;}
  body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
    background:radial-gradient(ellipse at 50% 40%, #1c0f38 0%, var(--bg) 70%);}
  #app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:10px 14px 12px;gap:8px;}
  header{display:flex;align-items:center;gap:10px;}
  header h1{flex:1;margin:0;text-align:center;font-size:17px;letter-spacing:.02em;color:var(--lav);line-height:1.15;}
  header h1 small{display:block;font-size:12px;font-weight:normal;color:var(--mint);}
  button{font:inherit;color:var(--ink);background:#22143d;border:1px solid #3a2766;border-radius:12px;padding:10px 12px;cursor:pointer;user-select:none;}
  button:active{transform:translateY(1px);background:#2d1a52;}
  button:disabled{opacity:.38;cursor:default;transform:none;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px;}
  header button{font-size:13px;padding:8px 10px;white-space:nowrap;}
  main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  #card{display:block;touch-action:manipulation;}
  #statusWrap{min-height:36px;}
  #playbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--lav);}
  #playbar.hide{visibility:hidden;}
  #playbar label{display:flex;align-items:center;gap:8px;flex:1;white-space:nowrap;}
  #playbar input{flex:1;accent-color:#8affea;min-width:60px;}
  #speedVal,#speedOutVal{min-width:44px;color:var(--mint);font-variant-numeric:tabular-nums;}
  #boomBtn{font-size:13px;padding:7px 10px;border-radius:18px;white-space:nowrap;}
  #boomBtn.on{background:var(--mint);color:#08120e;border-color:var(--mint);font-weight:bold;}
  .tile .badge{position:absolute;left:6px;bottom:6px;font-size:11px;font-weight:bold;padding:3px 7px;border-radius:10px;background:rgba(8,4,18,.8);color:var(--mint);}
  #status{font-size:13px;color:var(--lav);text-align:center;line-height:1.35;min-height:18px;max-height:7.2em;overflow:auto;user-select:text;-webkit-user-select:text;word-break:break-word;}
  #status.err{color:#ffb3d1;}
  #bar{height:4px;border-radius:2px;background:#1d1233;margin-top:6px;overflow:hidden;visibility:hidden;}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lav),var(--mint));transition:width .15s;}
  #primary{width:100%;font-size:18px;font-weight:bold;padding:14px;border:none;color:#12081f;background:linear-gradient(135deg,var(--mint),var(--lav));}
  #primary.stop{background:linear-gradient(135deg,var(--pink),#ffb36b);}
  #row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  #row button{font-size:13px;padding:10px 2px;}
  footer{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);gap:8px;}
  footer button{background:none;border:none;color:var(--dim);padding:2px 0;font-size:12px;text-decoration:underline dotted;}
  #estimate{text-align:right;}
  .sheet{position:fixed;inset:0;z-index:20;background:rgba(5,2,12,.95);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0)) 14px calc(12px + env(safe-area-inset-bottom,0));}
  .sheet.open{display:flex;}
  .sheet .top{display:flex;align-items:center;justify-content:space-between;max-width:560px;width:100%;margin:0 auto 10px;gap:10px;}
  .sheet h2{margin:0;font-size:17px;color:var(--lav);}
  .grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;max-width:560px;width:100%;margin:0 auto;align-content:start;}
  .grid h3{grid-column:1/-1;margin:6px 0 0;font-size:14px;color:var(--mint);font-weight:normal;}
  .tile{position:relative;background:none;border:none;padding:0;}
  .tile canvas{width:100%;height:auto;display:block;}
  .tile.sel canvas{outline:3px solid var(--mint);outline-offset:2px;border-radius:10px;}
  .tile .del{position:absolute;top:4px;right:4px;width:26px;height:26px;padding:0;border-radius:50%;font-size:13px;line-height:24px;background:rgba(10,5,20,.8);}
  .empty{grid-column:1/-1;color:var(--dim);text-align:center;margin-top:30px;font-size:14px;line-height:1.5;}
  #settingsBody{flex:1;overflow:auto;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-bottom:10px;}
  .seg{display:flex;gap:6px;}
  .seg button{flex:1;font-size:14px;padding:9px 4px;}
  .seg button.on{background:var(--lav);color:#12081f;border-color:var(--lav);font-weight:bold;}
  .field label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:4px;}
  .field label span{color:var(--dim);font-size:12px;}
  .field .ctl{display:flex;gap:10px;align-items:center;}
  .field input[type=range]{flex:1;accent-color:#c9a0ff;}
  .field input[type=number]{width:92px;font:inherit;font-size:14px;color:var(--ink);background:#1a1030;border:1px solid #3a2766;border-radius:8px;padding:6px;}
  .field.hide{display:none;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chips button{font-size:13px;padding:7px 10px;border-radius:18px;}
  .chips button.on{background:var(--mint);color:#08120e;border-color:var(--mint);font-weight:bold;}
  .note{font-size:12px;color:var(--dim);line-height:1.45;}
  select{font:inherit;font-size:14px;color:var(--ink);background:#1a1030;border:1px solid #3a2766;border-radius:8px;padding:7px;width:100%;}
  #result{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
  #result img,#result video{max-width:100%;max-height:100%;border-radius:12px;}
  #resultBtns{display:flex;gap:10px;max-width:560px;width:100%;margin:12px auto 0;}
  #resultBtns button{flex:1;font-size:15px;}
  #resultHint{text-align:center;font-size:12px;color:var(--dim);margin-top:8px;}
  #exportCv{position:fixed;left:-10000px;top:0;pointer-events:none;}
  @media (prefers-reduced-motion: reduce){ #bar i{transition:none;} }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="backBtn" aria-label="Back to town">◀ Town</button>
    <h1>Dream Generator<small id="townName">&nbsp;</small></h1>
    <button id="galBtn">Gallery</button>
  </header>
  <main id="main"><canvas id="card" aria-label="Dream trading card"></canvas></main>
  <div id="playbar" class="hide">
    <label>Zoom in <input type="range" id="speed" min="2" max="60" step="1" value="12" aria-label="Zoom in speed, frames per second"></label>
    <span id="speedVal">12 fps</span>
    <label>Zoom out <input type="range" id="speedOut" min="2" max="60" step="1" value="12" aria-label="Zoom out speed, frames per second"></label>
    <span id="speedOutVal">12 fps</span>
    <button id="boomBtn" class="on" aria-pressed="true">⇆ Zoomerang</button>
  </div>
  <div id="statusWrap"><div id="status" role="status">Starting up…</div><div id="bar"><i></i></div></div>
  <button id="primary" disabled>Dream this card</button>
  <div id="row">
    <button id="pickBtn">Card</button>
    <button id="setBtn">Settings</button>
    <button id="keepBtn" disabled>Keep</button>
    <button id="gifBtn" disabled>GIF</button>
    <button id="vidBtn" disabled>Video</button>
  </div>
  <footer>
    <button id="engineBtn" title="Re-test which engine is fastest on this device">Engine: detecting…</button>
    <span id="estimate"></span>
  </footer>
</div>

<div class="sheet" id="picker">
  <div class="top"><h2>Pick a card to dream</h2><button id="pickClose">Close</button></div>
  <div class="grid" id="pickGrid"></div>
</div>

<div class="sheet" id="settings">
  <div class="top"><h2>Dream settings</h2><button id="setClose">Done</button></div>
  <div id="settingsBody"></div>
</div>

<div class="sheet" id="gallery">
  <div class="top"><h2>Gallery</h2><button id="galClose">Close</button></div>
  <div class="grid" id="grid"></div>
</div>

<div class="sheet" id="resultSheet">
  <div class="top"><h2 id="resultTitle">Export</h2><button id="resultClose">Close</button></div>
  <div id="result"></div>
  <div id="resultBtns"><button id="dlBtn">Download</button><button id="shareBtn">Share</button><button id="delExportBtn">Delete</button></div>
  <div id="resultHint">On a phone you can also long-press the GIF to save it to your photos.</div>
</div>
<canvas id="exportCv"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.22.0/dist/tf-backend-webgpu.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.min.js"></script>
<script>
// ===== GIF ENCODER (median-cut palette per frame + LZW) =====
function ByteOut(){ this.buf=new Uint8Array(1<<16); this.n=0; }
ByteOut.prototype.grow=function(k){ if(this.n+k<=this.buf.length) return; var nb=new Uint8Array(Math.max(this.buf.length*2,this.n+k)); nb.set(this.buf.subarray(0,this.n)); this.buf=nb; };
ByteOut.prototype.byte=function(b){ this.grow(1); this.buf[this.n++]=b&255; };
ByteOut.prototype.u16=function(v){ this.byte(v&255); this.byte((v>>8)&255); };
ByteOut.prototype.str=function(s){ for(var i=0;i<s.length;i++) this.byte(s.charCodeAt(i)); };
ByteOut.prototype.arr=function(a,len){ len=len==null?a.length:len; this.grow(len); for(var i=0;i<len;i++) this.buf[this.n++]=a[i]; };
ByteOut.prototype.result=function(){ return this.buf.slice(0,this.n); };

function quantize(rgba){
  var n=rgba.length>>2, keys=new Uint16Array(n), hist=new Uint32Array(32768);
  for(var i=0,j=0;i<n;i++,j+=4){ var k=((rgba[j]>>3)<<10)|((rgba[j+1]>>3)<<5)|(rgba[j+2]>>3); keys[i]=k; hist[k]++; }
  var bins=[]; for(var k2=0;k2<32768;k2++) if(hist[k2]) bins.push(k2);
  function comp(k,a){ return a===0?(k>>10)&31:(a===1?(k>>5)&31:k&31); }
  function mkBox(list){ var mn=[31,31,31],mx=[0,0,0],cnt=0; for(var i=0;i<list.length;i++){ var k=list[i]; cnt+=hist[k]; for(var a=0;a<3;a++){ var v=comp(k,a); if(v<mn[a])mn[a]=v; if(v>mx[a])mx[a]=v; } }
    var ax=0,rg=-1; for(var a2=0;a2<3;a2++){ var r=mx[a2]-mn[a2]; if(r>rg){rg=r;ax=a2;} } return {list:list,cnt:cnt,axis:ax,range:rg}; }
  var boxes=[mkBox(bins)];
  while(boxes.length<256){
    var bi=-1,best=0; for(var b=0;b<boxes.length;b++){ var bx=boxes[b]; if(bx.list.length<2||bx.range<=0) continue; var sc=bx.range*bx.cnt; if(sc>best){best=sc;bi=b;} }
    if(bi<0) break;
    var box=boxes[bi], ax=box.axis; box.list.sort(function(p,q){ return comp(p,ax)-comp(q,ax); });
    var half=box.cnt/2, acc=0, cut=1; for(var m=0;m<box.list.length-1;m++){ acc+=hist[box.list[m]]; if(acc>=half){ cut=m+1; break; } cut=m+1; }
    boxes.splice(bi,1,mkBox(box.list.slice(0,cut)),mkBox(box.list.slice(cut)));
  }
  var pal=new Uint8Array(768), lut=new Uint8Array(32768);
  for(var p=0;p<boxes.length;p++){ var L=boxes[p].list, sr=0,sg=0,sb=0,c=0;
    for(var q=0;q<L.length;q++){ var kk=L[q], h=hist[kk]; sr+=comp(kk,0)*h; sg+=comp(kk,1)*h; sb+=comp(kk,2)*h; c+=h; lut[kk]=p; }
    pal[p*3]=Math.round(sr/c*255/31); pal[p*3+1]=Math.round(sg/c*255/31); pal[p*3+2]=Math.round(sb/c*255/31); }
  var idx=new Uint8Array(n); for(var t=0;t<n;t++) idx[t]=lut[keys[t]];
  return {palette:pal, indices:idx};
}

function lzw(out,indices,minCode){
  out.byte(minCode);
  var clear=1<<minCode, eoi=clear+1, size=minCode+1, next=eoi+1, dict=new Map();
  var cur=0, bits=0, blk=new Uint8Array(255), bl=0;
  function emit(code){ cur|=code<<bits; bits+=size; while(bits>=8){ blk[bl++]=cur&255; cur>>>=8; bits-=8; if(bl===255){ out.byte(255); out.arr(blk,255); bl=0; } } }
  emit(clear);
  var prefix=indices[0];
  for(var i=1;i<indices.length;i++){
    var k=indices[i], key=(prefix<<8)|k, v=dict.get(key);
    if(v!==undefined){ prefix=v; continue; }
    emit(prefix);
    if(next===4096){ emit(clear); dict.clear(); next=eoi+1; size=minCode+1; }
    else { if(next>=(1<<size)) size++; dict.set(key,next++); }
    prefix=k;
  }
  emit(prefix); emit(eoi);
  if(bits>0){ blk[bl++]=cur&255; }
  if(bl){ out.byte(bl); out.arr(blk,bl); }
  out.byte(0);
}

function GifEncoder(w,h){ this.w=w; this.h=h; this.out=new ByteOut(); var o=this.out;
  o.str("GIF89a"); o.u16(w); o.u16(h); o.byte(0x70); o.byte(0); o.byte(0);           // no global table
  o.byte(0x21); o.byte(0xFF); o.byte(11); o.str("NETSCAPE2.0"); o.byte(3); o.byte(1); o.u16(0); o.byte(0); // loop forever
}
GifEncoder.prototype.addFrame=function(rgba,delayCs){ var o=this.out, q=quantize(rgba);
  o.byte(0x21); o.byte(0xF9); o.byte(4); o.byte(0x04); o.u16(delayCs); o.byte(0); o.byte(0);   // GCE: disposal=1 (leave)
  o.byte(0x2C); o.u16(0); o.u16(0); o.u16(this.w); o.u16(this.h); o.byte(0x87);             // local table, 256 colours
  o.arr(q.palette,768); lzw(o,q.indices,8); };
GifEncoder.prototype.finish=function(){ this.out.byte(0x3B); return this.out.result(); };

// =====================================================================
//  DREAM GENERATOR — DeepDream trading cards with endless zooms.
//  Runs InceptionV1 (GoogLeNet -- the original DeepDream model) in the browser
//  with TensorFlow.js on whichever engine benchmarks fastest on this device
//  (WebGPU / WebGL = GPU, WASM / JS = CPU).
//  Model files: models/inceptionv1/  (make them with tools/export_inceptionv1.py)
// =====================================================================

// ===== CONFIG =====
const MODEL_URL = "models/inceptionv1/model.json";
// InceptionV1 dream layers, low -> high: the 9 Inception module outputs.
// model.execute() accepts these names (TF.js resolves them to the graph's
// output tensors, which are named e.g. "mixed4c:0").
const V1_LAYERS = ["mixed3a","mixed3b","mixed4a","mixed4b","mixed4c","mixed4d","mixed4e","mixed5a","mixed5b"];
const WASM_PATH = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/";
const TOWN_FILE = "index.html?ret=1";
const QUALITY = { fast:{w:192,h:240}, normal:{w:256,h:320}, high:{w:320,h:400}, max:{w:432,h:540} };
const OCTAVES = 3, OCTAVE_SCALE = 1.35, JITTER = 16;
const MAX_FRAMES = 1000, PLAY_FPS = 12, GIF_W = 360, VIDEO_W = 540; // MAX_FRAMES = total a card can hold across multiple Zoom presses; the Settings slider caps each press at 100
// Playback: frames per second and "zoomerang" (zoom in, then back out to the start)
function clampFps(v){ v=parseFloat(v); if(!(v>0)) v=PLAY_FPS; return Math.max(2,Math.min(60,v)); }
function cardFps(c){ return clampFps(c&&c.playFps); }
function cardFpsOut(c){ return clampFps(c&&c.playFpsOut!=null?c.playFpsOut:cardFps(c)); }
// Frame index for elapsed seconds, honoring separate zoom-in / zoom-out speeds on the zoomerang.
function boomFrame(c,tSec){
  const n=c.frames.length, fi=cardFps(c), fo=cardFpsOut(c);
  if(!(cardBoom(c)&&n>2)) return Math.floor(tSec*fi)%n;
  const tIn=n/fi, tOut=(n-2)/fo, tc=tSec%(tIn+tOut);
  if(tc<tIn) return Math.min(n-1,Math.floor(tc*fi+1e-6));
  return Math.max(1,(n-2)-Math.floor((tc-tIn)*fo+1e-6));
}
// 0 = zoom-in leg, 1 = zoom-out leg, for output frame i of an exported sequence.
function seqLeg(c,i){ const n=c.frames.length; if(!(cardBoom(c)&&n>2)) return 0; return (i%(2*n-2))>=n?1:0; }
function cardBoom(c){ return !c||c.boomerang!==false; }
function seqLength(c){ const n=c.frames.length; return (cardBoom(c)&&n>2)?2*n-2:n; }
function seqFrame(c,k){ const n=c.frames.length; if(!(cardBoom(c)&&n>2)) return k%n; const p=2*n-2, m=k%p; return m<n?m:p-m; }
const AREAS = {   // must match AREAS in index.html
  "map":   { first:1,  last:11, name:"Dream Core" },
  "woods": { first:12, last:22, name:"Waking Woods" }
};
// Each zoom frame crops by zoomFactor around a centre that moves along the chosen path,
// resizes back up, then runs `steps` gradient-ascent steps at learning rate `lr`.
const DEFAULTS = { path:"straight", frames:60, zoomFactor:0.97, steps:8, lr:0.04, range:0.08, segFrames:10, startSteps:15, sharpen:0.35, layers:["mixed4b","mixed4c"], quality:"", heat:"balanced" };
const PRESETS = [
  // Tuned for phone-sized dreams: stronger pushes and faster zooms so the effect really shows.
  { name:"Wild dive (straight)",      s:{ path:"straight", frames:60, zoomFactor:0.96,  steps:8,  lr:0.045, startSteps:15, sharpen:0.35, layers:["mixed4a","mixed4b"] } },
  { name:"Eye storm (square)",        s:{ path:"square",   frames:80, zoomFactor:0.97,  steps:10, lr:0.05,  range:0.10, segFrames:8,  startSteps:20, sharpen:0.35, layers:["mixed4c","mixed4d"] } },
  { name:"Triangle trip",             s:{ path:"triangle", frames:90, zoomFactor:0.97,  steps:8,  lr:0.045, range:0.12, segFrames:10, startSteps:15, sharpen:0.35, layers:["mixed4a","mixed4d"] } },
  { name:"Swirl melt (fast, cool)",   s:{ path:"straight", frames:80, zoomFactor:0.95,  steps:4,  lr:0.06,  startSteps:10, sharpen:0.4,  layers:["mixed3a","mixed4a"] } },
  { name:"Beast mode (slow, hot)",    s:{ path:"square",   frames:60, zoomFactor:0.975, steps:20, lr:0.06,  range:0.08, segFrames:10, startSteps:25, sharpen:0.3,  layers:["mixed4e","mixed5a"] } },
  { name:"Slow drift (square, subtle)", s:{ path:"square", frames:100, zoomFactor:0.99, steps:6, lr:0.03, range:0.04, segFrames:15, startSteps:20, sharpen:0.3, layers:["mixed4c","mixed4d"] } },
  { name:"Hound dreams (the dog-slugs)", s:{ path:"straight", frames:70, zoomFactor:0.96, steps:18, lr:0.055, startSteps:25, sharpen:0.35, layers:["mixed4d","mixed4e"] } },
  { name:"Eyeball soup",               s:{ path:"square", frames:80, zoomFactor:0.97, steps:16, lr:0.065, range:0.08, segFrames:8, startSteps:25, sharpen:0.35, layers:["mixed4c","mixed4d"] } },
  { name:"Bird choir (triangle)",      s:{ path:"triangle", frames:80, zoomFactor:0.97, steps:14, lr:0.06, range:0.1, segFrames:10, startSteps:20, sharpen:0.35, layers:["mixed4b","mixed4c"] } },
  { name:"Deep ones (sea beasts)",      s:{ path:"straight", frames:70, zoomFactor:0.965, steps:14, lr:0.06, startSteps:20, sharpen:0.35, layers:["mixed4a","mixed4b","mixed4c"] } },
  { name:"Pagoda mind",                s:{ path:"square", frames:70, zoomFactor:0.975, steps:12, lr:0.05, range:0.06, segFrames:10, startSteps:20, sharpen:0.3, layers:["mixed4e","mixed5a"] } },
  { name:"Critter static (insects)",    s:{ path:"straight", frames:80, zoomFactor:0.96, steps:12, lr:0.055, startSteps:15, sharpen:0.4, layers:["mixed3b","mixed4b"] } },
  { name:"Ghost zoo (apparitions)",     s:{ path:"triangle", frames:70, zoomFactor:0.97, steps:10, lr:0.045, range:0.08, segFrames:10, startSteps:20, sharpen:0.3, layers:["mixed5a","mixed5b"] } },
  { name:"The 2015 classic",           s:{ path:"straight", frames:60, zoomFactor:0.96, steps:22, lr:0.05, startSteps:30, sharpen:0.35, layers:["mixed4c","mixed4d","mixed4e"] } }
];
const FIELDS = [
  { k:"frames",     label:"Frames per run",       min:1,    max:100,  step:1,      note:"How many frames each press of Zoom makes ." },
  { k:"zoomFactor", label:"Zoom factor",          min:0.9,  max:1,    step:0.0001, note:"Crop size each frame. 0.9999 barely moves, 0.98 dives fast." },
  { k:"steps",      label:"Steps per frame",      min:1,    max:50,   step:1,      note:"More steps = stronger dream, slower frames." },
  { k:"lr",         label:"Learning rate",        min:0.001,max:0.2,  step:0.0001, note:"How hard each step pushes the dream." },
  { k:"range",      label:"Movement range",       min:0,    max:0.3,  step:0.001,  paths:["square","triangle"], note:"How far the zoom centre drifts, as a fraction of the image." },
  { k:"segFrames",  label:"Frames per side",      min:1,    max:100,  step:1,      paths:["square","triangle"], note:"Frames spent on each side of the square or triangle." },

}

  $("engineBtn").textContent="Engine: "+LABEL[name];

  if(!use.length){ const pref=["mixed4c","mixed4d"].filter(n=>modelLayers.indexOf(n)>=0); use=pref.length?pref:modelLayers.slice(-2); }
  return use;
}
function getGrad(){
  const use=activeLayers(), key=use.join("+");

    let outs=model.execute(img,use); if(!Array.isArray(outs)) outs=[outs];

function roll(t,shift,axis){ const n=t.shape[axis]; shift=((shift%n)+n)%n; if(!shift) return t; const p=tf.split(t,[n-shift,shift],axis); return tf.concat([p[1],p[0]],axis); }

async function creatureLayer(num){   // pixel sprite with its deepdream texture, like the binder; photo blob if no sprite

async function renderSeedArt(seed,cv,w,h){

// ===== DREAM (starting dream, then zoom runs) =====
async function startDream(){

  const steps=Math.round(settings.startSteps), total=Math.max(1,steps*OCTAVES);
  card.recipe={ start:steps, startLayers:activeLayers().join("+"), startLr:+Math.max(0.01,settings.lr).toFixed(4), size:card.w+"×"+card.h, engine:ENGINE_SHORT[engineOrder[engineIdx]]||"GPU", runs:[] };
  for(;;){
    try{
      let img=tf.tidy(()=>canvasToTensor(seedCv).add(tf.randomUniform([1,card.h,card.w,3],-10,10)).clipByValue(-117,138));
      if(steps>0){ let done=0;
        for(let o=OCTAVES-1;o>=0;o--){
          const s=Math.pow(OCTAVE_SCALE,-o), h=Math.max(96,Math.round(card.h*s)), w=Math.max(96,Math.round(card.w*s));
          const r=tf.image.resizeBilinear(img,[h,w]); img.dispose(); img=r;
          for(let i=0;i<steps;i++){ const t0=performance.now(); const n=dreamStep(img,Math.max(0.01,settings.lr)); img.dispose(); img=n; done++;
            setStatus("Dreaming… detail layer "+(OCTAVES-o)+" of "+OCTAVES); setBar(done/total);
            if(i%3===2||i===steps-1) await tensorToCanvas(img,artCv); else await tf.nextFrame();
            if(o===0) noteStepTime(performance.now()-t0);
            const rest=HEAT_REST[settings.heat]||0; if(rest) await sleep((performance.now()-t0)*rest); }
        }
      }
      cur=img; break;
    }catch(e){
      console.error(e);
      if(!(await nextEngine())){ setStatus("Dreaming failed on every engine: "+(e&&e.message||e),true); setBar(null); busy=false; updateUI(); return; }
      setStatus("Switched to "+LABEL[engineOrder[engineIdx]]+" — trying again…");
    }
  }
  await tensorToCanvas(cur,artCv); await pushFrame();
  busy=false; live=false; setBar(null); playStart=performance.now();
  setStatus(card.name+" is dreaming. Press Zoom to fall in ("+styleLabel().toLowerCase()+", "+settings.frames+" frames).");

}

$("speed").onchange=()=>playbarChanged();
$("speedOut").oninput=e=>{ if(!card) return; card.playFpsOut=+e.target.value; $("speedOutVal").textContent=card.playFpsOut+" fps"; };
$("speedOut").onchange=()=>playbarChanged();
$("boomBtn").onclick=()=>{ if(!card) return; card.boomerang=!cardBoom(card); playStart=performance.now(); playbarChanged(); };
function updateUI(){
  syncPlaybar();
  const p=$("primary"), has=!!(card&&card.frames.length);
  p.classList.toggle("stop",zooming);
  if(zooming){ p.textContent="Stop zooming"; p.disabled=false; }
  else if(has){ p.textContent=card.frames.length>=MAX_FRAMES?"Card is full":"Zoom ("+styleLabel().toLowerCase()+")"; p.disabled=busy||!ready||card.frames.length>=MAX_FRAMES; }
  else { p.textContent=card?"Dream this card":"Pick a card"; p.disabled=busy||(card&&!ready); }
  const idle=has&&!busy&&!zooming;
  $("pickBtn").disabled=busy||zooming; $("setBtn").disabled=zooming;
  $("keepBtn").disabled=!idle||(card.saved&&!card.dirty); $("keepBtn").textContent=(has&&card.saved)?(card.dirty?"Update":"Kept"):"Keep";
  $("gifBtn").disabled=!idle; $("vidBtn").disabled=!idle;
  $("galBtn").disabled=busy||zooming; $("engineBtn").disabled=busy||zooming;
}
$("primary").onclick=()=>{ if(zooming){ zooming=false; setStatus("Finishing this frame…"); } else if(card&&card.frames.length) zoomRun(); else if(card) startDream(); else openPicker(); };
$("pickBtn").onclick=openPicker; $("pickClose").onclick=closePicker;
$("setBtn").onclick=openSettings; $("setClose").onclick=closeSettings;
$("keepBtn").onclick=keepCard; $("gifBtn").onclick=exportGif; $("vidBtn").onclick=exportVideo;
$("galBtn").onclick=openGallery; $("galClose").onclick=closeGallery;
$("engineBtn").onclick=()=>{ if(busy||zooming) return; if(card&&card.dirty&&!confirm("Re-test engines? This reloads the page and the current dream isn't kept yet.")) return; try{ localStorage.removeItem(ENGINE_KEY); }catch(e){} location.reload(); };
function goTown(){ if(card&&card.dirty&&card.frames.length&&!confirm("Leave without keeping "+card.name+"?")) return; zooming=false; location.href=TOWN_FILE; }
$("backBtn").onclick=goTown;
addEventListener("keydown",e=>{
  const t=e.target&&e.target.tagName; if(t==="INPUT"||t==="SELECT") return;
  const open=["picker","settings","gallery","resultSheet"].filter(id=>$(id).classList.contains("open"));
  if(open.length){ if(e.key==="Escape"||e.key==="b"){ closePicker(); closeGallery(); if($("settings").classList.contains("open")) closeSettings(); $("resultClose").onclick(); } return; }
  if(e.key==="a"||e.key==="Enter"||e.key===" "){ if(document.activeElement&&document.activeElement.tagName==="BUTTON"&&e.key!=="a") return; e.preventDefault(); if(!$("primary").disabled) $("primary").onclick(); }
  else if(e.key==="b"||e.key==="Escape"){ goTown(); }
});

// ===== BOOT =====
async function boot(){
  layout(); requestAnimationFrame(tick); updateUI();
  // Show the newest card from your collection straight away (fusions first).
  const col=readCollection(); await useSeed(col.length?col[0]:wildSeed());
  setStatus(card.name+" popped out of your collection. Loading the dream engine…");
  if(typeof tf==="undefined"){ setStatus("Couldn't load TensorFlow.js. Check your internet connection and reload.",true); return; }
  let found=false; try{ const r=await fetch(MODEL_URL,{cache:"no-cache"}); found=r.ok; }catch(e){}
  if(!found){ setStatus("Model not found at "+MODEL_URL+". Run “Build DeepDream model” in GitHub Actions (see DREAM_GENERATOR.md).",true); return; }
  try{ tf.enableProdMode(); }catch(e){}
  engineOrder=await pickEngines(); engineIdx=-1;
  if(!(await nextEngine())){ setStatus("The dream engine couldn't start. "+(engineErrors.length?engineErrors[engineErrors.length-1]:"No engine was available."),true); $("engineBtn").textContent="Engine: none"; return; }
  if(!QUALITY[settings.quality]){ settings.quality=(engineOrder[engineIdx]==="webgpu"||engineOrder[engineIdx]==="webgl")?"normal":"fast"; saveSettings(); }
  ready=true; card.style=styleLabel()+" · "+layersLabel();
  setStatus("Ready. "+card.name+" is loaded — press Dream this card, or pick another with Card.");
  updateUI();
}
boot();
</script>
