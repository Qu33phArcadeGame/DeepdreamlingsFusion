name: Build DeepDream v2 model
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TensorFlow + converter + tf-slim
        run: pip install "tensorflow>=2.13,<2.16" "tensorflowjs>=4.13,<4.18" tf-slim "tf-keras>=2.13,<2.16"
      - name: Export InceptionV2 (TF-Slim checkpoint)
        run: python tools/export_inceptionv2.py
      - name: Commit model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/inceptionv2
          git commit -m "Add InceptionV2 model for the Dream Generator (Waking Woods)" || echo "No changes"
          git push
