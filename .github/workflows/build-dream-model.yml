name: Build DeepDream model
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install TensorFlow + converter
        run: pip install "tensorflow>=2.13,<2.16" "tensorflowjs>=4.13,<4.18"
      - name: Export InceptionV1 (original DeepDream graph)
        run: python tools/export_inceptionv1.py
      - name: Commit model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/inceptionv1
          git commit -m "Add InceptionV1 model for the Dream Generator" || echo "No changes"
          git push
